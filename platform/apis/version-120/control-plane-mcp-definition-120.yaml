  - name: manageCapabilityBWCE
    description: "Provision or update a bwce capability inside the given data plane\n\nPurpose: This tool provisions a new bwce capability instance or updates an existing one inside a specified data plane.\nIf capability-instance-id is provided, the existing capability instance is updated; otherwise, a new one is provisioned.\nFor updates, only provide the fields that need to be changed. Fields that are omitted will remain unchanged.\n\nInput:\n- data-plane-id: The ID of the data plane where the bwce capability instance will be provisioned or updated.\n- capability-instance-id: Optional. The ID of the capability instance to update. If omitted, a new instance is provisioned.\n- provision-schema: The schema containing the details required to provision or update the bwce capability instance. This includes:\n\t- path-prefix: The path prefix for the bwce capability instance. Required for create, optional for update.\n\t- storage-class-resource-instance-id: The ID of the storage class resource instance. Required for provisioning, must not be provided for update.\n\t- ingress-controller-resource-instance-id: Optional ID of the ingress controller resource instance to be used by the bwce capability. This is only needed if user wants to use ingress controller instead of gateway \n\t- gateway-resource-instance-id: Optional ID of the gateway resource instance to be used by the bwce capability. This is only needed if user wants to use gateway instead of ingress controller \n\t- db-config-resource-instance-id: Optional ID of the database config resource instance to be used.\n\t- execution-history-enabled: Optional flag indicating whether to enable execution history for the bwce capability instance.\n\n\t- fluentbit-sidecar-enabled: A boolean indicating whether the Fluent Bit sidecar to be enabled which is used for centralized logging. Required for create, optional for update.\n\n\t- auto-discovery-enabled: Optional flag indicating whether to enable auto-discovery for the bwce capability instance.\n\t- auto-discovery-config: Optional configuration details for auto-discovery, including:\n\t\t- label-selectors: A map of label selectors to be used for auto-discovery.\n\t\t- port: The port number to be used for auto-discovery.\n\nOutput:\n- For provisioning: The details of the provisioned bwce capability instance, including:\n\t- capabilityInstanceId: The ID of the provisioned capability instance.\n\t- releasesStatus: A list of release statuses, each containing name, namespace, releaseName, revision, status, and error.\n\t- successfulReleases: A list of successfully deployed releases with the same structure.\n- For update: A success message confirming the capability instance was updated.\n\nNote: The db-config-resource-instance-id is optional and is only needed if execution-history-enabled is set to true. If execution history is not required, this field can be omitted.\n auto-discovery-config is optional and is only needed if auto-discovery-enabled is set to true. If auto-discovery is not required, this field can be omitted.\n The ingress-controller-resource-instance-id and gateway-resource-instance-id are mutually exclusive. Only one of them is needed based on whether user wants to use ingress controller or gateway.\n\nSamples:\n         - Sample 1 — Success (provision)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"provision-schema\": {\"path-prefix\": \"/bwce\", \"storage-class-resource-instance-id\": \"storage-001\", \"ingress-controller-resource-instance-id\": \"ingress-001\", \"execution-history-enabled\": true, \"db-config-resource-instance-id\": \"db-001\", \"fluentbit-sidecar-enabled\": true, \"auto-discovery-enabled\": true, \"auto-discovery-config\": {\"label-selectors\": {\"app\": \"bwce\"}, \"port\": 8080}}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"capabilityInstanceId\":\"bwce-inst-001\",\"releasesStatus\":[{\"name\":\"bwceprovisioner\",\"namespace\":\"ns-001\",\"releaseName\":\"bwceprovisioner-bwce-inst-001\",\"revision\":1,\"status\":\"deployed\",\"error\":\"\"}],\"successfulReleases\":[{\"name\":\"bwceprovisioner\",\"namespace\":\"ns-001\",\"releaseName\":\"bwceprovisioner-bwce-inst-001\",\"revision\":1,\"status\":\"deployed\",\"error\":\"\"}]},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 2 — Success (update)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"capability-instance-id\": \"bwce-inst-001\", \"provision-schema\": {\"path-prefix\": \"/bwce\", \"ingress-controller-resource-instance-id\": \"ingress-001\", \"execution-history-enabled\": true, \"db-config-resource-instance-id\": \"db-001\", \"fluentbit-sidecar-enabled\": true, \"auto-discovery-enabled\": true, \"auto-discovery-config\": {\"label-selectors\": {\"app\": \"bwce\"}, \"port\": 8080}}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Successfully updated capability instance 'bwce-inst-001' on dataplane 'dp-123'\"},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 3 — Success (partial update — only change path prefix)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"capability-instance-id\": \"bwce-inst-001\", \"provision-schema\": {\"path-prefix\": \"/bwce-v2\"}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Successfully updated capability instance 'bwce-inst-001' on dataplane 'dp-123'\"},\"context\":[\"2025-01-01T00:00:00Z\"]}"
