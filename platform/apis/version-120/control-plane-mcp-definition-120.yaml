  - name: listResourceInstances
    description: |-
      List details of multiple resource instances in a subscription with optional filters

      Purpose: To list detailed resource instance information in a single, unified response. The tool consolidates data across control plane APIs to reduce round trips and supports filtering when you only need a subset.

      Input:
      - dataPlaneId: Optional filter to get details of resource instances with scope as dataplane(s). Accepts single or multiple IDs as an array
      - dataPlaneName: Optional filter to get details of resource instances with scope as dataplane(s). Accepts single or multiple names as an array
      - resourceInstanceId: Optional filter to get details of specific resource instance(s) by ID(s). Accepts single or multiple IDs as an array
      - resourceType: Optional filter to get details of resource instances for specific resource type(s). Accepts single or multiple types as an array. To get the correct type 'listResources' tool can be used and 'id' from the response should be used.
      - includeFields: Optional filter to specify which attributes to include in the response. Accepts an array of field names from the output details (e.g., ['id', 'name', 'type', 'scope', 'data-plane-id']). When provided, only the specified fields will be returned
      - page: Optional page number for pagination
      - limit: Optional limit for pagination
      - orderBy: Optional name of the field to order the results by. Supported values: 'id', 'name', 'type', 'scope', 'data-plane-id', 'data-plane-name'
      - order: Optional sort order. Supported values: 'asc' or 'desc'. Only takes effect when orderBy is provided

      Returns: A JSON object containing:
      - data: A list of resource instances (described below)
      - total-records-in-table: Total number of records returned, to be used for pagination

      For resources with scope 'DataPlane', each item in 'data' includes: id, name, type, scope, data-plane-id, data-plane-name, instance-details, linked-capabilities (id, name, capability). For resources with scope 'Subscription', each item includes: id, name, type, scope, instance-details, linked-dataplanes (id, name).

      Samples:
               - Sample 1 — Success (Single values)
                  Input:
                   {"dataPlaneId": ["dp-123"], "resourceType": ["postgres"]}
                  Output:
                   {"status":"success","response":{"data":[{"id":"res-001","name":"postgres-db","type":"postgres","scope":"DataPlane","data-plane-id":"dp-123","data-plane-name":"Production DP","instance-details":{...},"linked-capabilities":[{"id":"cap-001","name":"BWCE","capability":"BWCE"}]}],"total-records-in-table":1},"context":["2024-11-11T11:04:59.224Z"]}

               - Sample 2 — Success (Multiple values)
                  Input:
                   {"dataPlaneId": ["dp-123", "dp-456"], "resourceType": ["postgres", "kafka"]}
                  Output:
