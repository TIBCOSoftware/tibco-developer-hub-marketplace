serverInfo:
  name: ControlPlaneMCPServer
  title: Control Plane MCP Server
  version: 1.20.0
capabilities:
  logging: {}
  tools:
    listChanged: true
tools:
  - name: createActivationServer
    description: |-
      Create an activation server resource at the subscription or dataplane level

      Purpose: To create an activation server resource at the subscription or dataplane level to connect to an activation server

      Input: CreateActivationServerInput with the following fields:
      - data-plane-id: (Optional) ID of the data plane for which the activation server resource will be created. If not provided, the activation server resource will be created at the subscription level
      - name: Name of the activation server resource
      - description: Description of the activation server resource
      - url: URL of the activation server

      Returns: Id of the created resource in case of successful creation of the activation server resource
      - resource_instance_id : Unique identifier for the created activation server resource instance

      Note: Activation server resource is type of Resource known to system as 'ACTIVATION_SERVER' and can be created at both subscription and data plane level
      During creation, prompt the user to choose between creating the resource at the dataplane level or the subscription level. If the user selects the dataplane level, the 'data-plane-id' field must be provided. If the subscription level is chosen, 'data-plane-id' can be left blankSamples:
               - Sample 1 — Success
                  Input:
                   {"name": "production-activation", "description": "Production activation server", "url": "https://activation.company.com"}
                  Output:
                   {"status":"success","response":{"resource_instance_id":"activation-001"},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: 'Optional: id of the data plane for which the activation server resource is to be created. To check for possible values, use the ''listDataplanes'' tool and show them to the user.'
        name:
          type: string
          description: name of the activation server resource to be created
        description:
          type: string
          description: description of the activation server resource to be created
        url:
          type: string
          description: url of the activation server to connect
      required:
        - name
        - description
        - url
      additionalProperties: false
  - name: createBWAgent
    description: "Create a BW agent resource instance to facilitate communication between control plane and on-prem bw agents\n\nPurpose: To create a BW agent resource instance that facilitates communication between control plane and on-prem bw agents\n\nInput:\n- data-plane-id: ID of the data plane with which the BW Agent resource will be linked\n- url: URL of the on prem BW Agent\n- name: Name of the BW Agent resource instance\n- description: Description of the BW Agent resource instance\n- agent-name: Name of the on prem BW agent\n- agent-description: Description of the on prem BW Agent \n- network-name: Name of the network which is used to create on prem BW Agent\n- product-version: Version of the BW product (e.g., 6.5.0)\n\nReturns: Id of the created resource in case of successful creation of the BW agent\n- resource_instance_id : Unique identifier for the created BW Agent resource instance\n\nNote: BW agent is a type of resource known to the Control Plane as 'BW_AGENT' and is created only at the data plane levelSamples:\n         - Sample 1 — Success\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"url\": \"http://bw-agent.company.com:8080\", \"name\": \"production-bw-agent\", \"description\": \"Production BW agent\", \"agent-name\": \"bw-prod-agent\", \"agent-description\": \"Production BusinessWorks agent\", \"network-name\": \"production-network\", \"product-version\": \"6.8.0\"}\n            Output:\n             {\"status\":\"success\",\"response\":{\"resource_instance_id\":\"bw-agent-001\"},\"context\":[\"2025-01-01T00:00:00Z\"]}"
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane for which the bw agent is to be created. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        url:
          type: string
          description: URL of the BW agent
        name:
          type: string
          description: name of the bw agent  resource to be created
        description:
          type: string
          description: description of the bw agent to be created
        agent-name:
          type: string
          description: name of the agent
        agent-description:
          type: string
          description: description of the agent
        network-name:
          type: string
          description: name of the network
        product-version:
          type: string
          description: version of the product
      required:
        - data-plane-id
        - url
        - name
        - description
        - agent-name
        - agent-description
        - network-name
        - product-version
      additionalProperties: false
  - name: createHawkDomainRV
    description: |-
      Create a hawk domain with RV transport

      Purpose: To create a hawk domain with RV transport at the dataplane level

      Input: CreateHawkDomainForRVInput with the following fields:
      - data-plane-id: ID of the data plane where the hawk domain will be created
      - domain-name: Name of the hawk domain
      - rv: RV configuration details for the hawk domain including:
      	- rv-service: RV service name
      	- rv-network: RV network name
      	- rv-daemon: RV daemon address

      Returns: Id of the created resource in case of successful creation of the hawk domain
      - resource_instance_id : Unique identifier for the created hawk domain resource instance

      Note: Hawk domain is type of Resource known to system as 'HAWK_DOMAIN' and is created at the only data plane levelSamples:
               - Sample 1 — Success
                  Input:
                   {"data-plane-id": "dp-123", "domain-name": "rv-domain", "rv": {"rv-service": "7500", "rv-network": "rv-network", "rv-daemon": "tcp:7500"}}
                  Output:
                   {"status":"success","response":{"resource_instance_id":"hawk-rv-001"},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane for which the hawk domain is to be created. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        domain-name:
          type: string
          description: name of the hawk domain to be created
        rv:
          type: object
          properties:
            rv-service:
              type: string
              description: rv service of the hawk domain
            rv-network:
              type: string
              description: rv network of the hawk domain
            rv-daemon:
              type: string
              description: rv daemon of the hawk domain
          description: rendezvous details of the hawk domain
          required:
            - rv-service
            - rv-network
            - rv-daemon
          additionalProperties: false
      required:
        - data-plane-id
        - domain-name
        - rv
      additionalProperties: false
  - name: createStorageClass
    description: |-
      Create a storage class to manage storage resources within a data plane

      Purpose: To create a storage class that manages storage resources within a data plane

      Input: StorageClassInput with the following fields:
      - data-plane-id: ID of the data plane where the storage class will be created
      - name: Name of the storage class
      - description: Description of the storage class
      - storage-class-name: Name of the storage class in the underlying infrastructure (e.g., Kubernetes StorageClass name)

      Returns: Id of the created resource in case of successful creation of the storage class
      - resource_instance_id : Unique identifier for the created storage class resource instance

      Note: Storage class is a type of Resource known to the Control Plane as 'STORAGE_CLASS' and is created only at the data plane levelSamples:
               - Sample 1 — Success
                  Input:
                   {"data-plane-id": "dp-123", "name": "fast-storage", "description": "High-performance SSD storage", "storage-class-name": "gp2-ssd"}
                  Output:
                   {"status":"success","response":{"resource_instance_id":"storage-001"},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane for which the storage resource is to be created. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        name:
          type: string
          description: name of the storage class to be created
        description:
          type: string
          description: description of the storage class to be created
        storage-class-name:
          type: string
          description: name of storage class in the data plane cluster
      required:
        - data-plane-id
        - name
        - description
        - storage-class-name
      additionalProperties: false
  - name: deleteCapabilityInstanceInsideDataPlane
    description: |-
      Delete a capability instance inside a data plane

      Purpose: This tool deletes a specific capability instance associated with a data plane.

      Input:
      - data-plane-id: The ID of the data plane where the capability instance is located.
      - capability-instance-id: The ID of the capability instance to delete.

      Output: A confirmation message indicating the successful deletion of the capability instance.

      Note: This tool is used to remove a capability instance from a data plane. It is important to ensure that the capability instance is no longer needed before deletion, as this action cannot be undone.Samples:
               - Sample 1 — Success
                  Input:
                   {"data-plane-id": "dp-123", "capability-instance-id": "bwce-inst-001"}
                  Output:
                   {"status":"success","response":{"message":"Capability instance bwce-inst-001 successfully deleted from data plane dp-123"},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane from which the capability instance is to be deleted. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        capability-instance-id:
          type: string
          description: instance id of the capability to be deleted. To check for possible values, use the 'listCapabilityInstances' tool and show them to the user.
      required:
        - data-plane-id
        - capability-instance-id
      additionalProperties: false
  - name: deleteDataPlane
    description: |-
      Delete a data plane

      Purpose: This tool is used to delete a data plane, removing it from the list of active data planes.
      This is destructive command and removes data plane from active use.
      Warning: This is irreversible

      Input:
      - data-plane-id: The unique identifier of the data plane to be unregistered
      - force: Optional input indicating if the deletion should be forced. Default value is false

      Note: This operation may also be referred to as 'unregistering' a data plane.

      Output: The result of the deletion includes:
      - id: Unique identifier of the deleted data plane
      - message: Additional message or information about the deletionSamples:
               - Sample 1 — Success
                  Input:
                   {"data-plane-id": "dp-123", "force": true}
                  Output:
                   {"status":"success","response":{"id":"dp-123","message":"Data plane dp-123 successfully unregistered and removed from active data planes"},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane to be unregistered. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        force:
          type: boolean
          description: Optional flag to force unregister the data plane. If set to true, the data plane will be unregistered even if it has capabilities or applications associated with it. If the user has not explicitly set it, the default value false should be used.
      required:
        - data-plane-id
      additionalProperties: false
  - name: deleteResourceInstance
    description: "Delete a specific resource instance with subscription scope or data plane scope \n\nPurpose: To delete a specific resource instance configured at either the subscription level or at at the dataplane level \n\nInput: \n- resourceInstanceId: Resource Instance ID to be deleted\n- dataPlaneId: Optional Input. This data plane ID is needed if the resource exists at the dataplane level. If this is not passed subscription scope is considered .\n\nReturns:\n- message: Confirmation message indicating the resource instance has been deleted successfully.\n\nNote: Delete tools should only be called when explicitly required as they will remove the resource instance and its associated configurations permanently. It should always be double checked before invoking the delete tools.\n\nSamples:\n         - Sample 1 — Success (Subscription Level)\n            Input:\n             {\"resourceInstanceId\": \"res-456\"}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Resource instance res-456 has been deleted successfully\"},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 2 — Success (Data Plane Level)\n            Input:\n             {\"resourceInstanceId\": \"res-456\", \"dataPlaneId\": \"dp-123\"}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Resource instance res-456 has been deleted successfully from data plane dp-123\"},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 3 — Error\n             Input:\n               {\"appId\": \"app-999\"}\n             Output:\n               {\"status\": \"error\",\"code\": \"CP-10000\",\"message\": \"Error summary\",\"details\": \"Error details\",\"context\": [\"2025-03-11T04:53:52Z\"]}"
    inputSchema:
      type: object
      properties:
        resourceInstanceId:
          type: string
          description: id of the resource instance to be deleted. To check for possible values, use the 'listResourceInstances' tool.
        dataPlaneId:
          type: string
          description: optional id of the data plane from which the resource instance is to be deleted. If provided, the resource instance will be deleted from the data plane scope. If not provided, the resource instance will be deleted from the subscription scope. To check for possible values, use the 'listDataplanes' tool.
      required:
        - resourceInstanceId
      additionalProperties: false
  - name: getCapabilitiesMetadata
    description: |-
      Get metadata of supported capabilities and their available versions

      Purpose: To list capabilities currently supported on the platform along with the versions available for each capability. Use this to validate capability ids and choose correct versions before provisioning or other operations.

      Input: None

      Output: A list of capabilities, each containing:
      - capability-id: Identifier of the capability
      - name: Human friendly name of the capability
      - versions: The currently supported versions for the capability

      Samples:
               - Sample 1 — Success
                  Input:
                   {}
                  Output:
                   {"status":"success","response":[{"capability-id":"TIBCOHUB","name":"TIBCO® Developer Hub","versions":["1.15.0","1.14.0","1.13.0"]},{"capability-id":"FLOGO","name":"TIBCO Flogo®","versions":["1.15.0","1.14.0","1.13.0","1.12.0"]},{"capability-id":"EMS","name":"TIBCO Enterprise Message Service™","versions":["1.15.0","1.14.0","1.13.0"]},{"capability-id":"BWCE","name":"TIBCO BusinessWorks™ 6 (Containers)","versions":["1.15.0","1.14.0","1.13.0"]},{"capability-id":"BW5CE","name":"TIBCO BusinessWorks™ 5 (Containers)","versions":["1.15.0","1.14.0","1.13.0"]}],"context":["2026-01-13T07:51:49.773Z"]}

               - Sample 2 — Error
                  Input:
                   {}
                  Output:
                   {"status": "error","code": "CP-10000","message": "Error summary","details": "Error details","context": ["2026-01-13T07:51:49.773Z"]}
    inputSchema:
      type: object
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: linkResourceInstancesToDataPlane
    description: |-
      Link resource instances to a data plane

      Purpose: This tool is used to link one or more resource instances to a data plane, establishing a connection between them.

      Input:
      - data-plane-id: The unique identifier of the data plane to which the resources are to be linked
      - resource-instance-id: The unique identifiers of the resource instances to be linked
      - resource-type: The type of the resources being linked
      - operation: The operation to be performed. It can be 'link' or 'unlink'

      Output: The result of the linking operation including:
      - id: Unique identifier of the data plane
      - resource-instances: List of resource instances linked to the data plane. Each instance detail includes:
      	- id: Unique identifier of the resource instance
      	- type: Type of the resource instance
      	- status: Status of the resource instance
      	- message: Additional message or information about the resource instance statusSamples:
               - Sample 1 — Success
                  Input:
                   {"data-plane-id": "dp-123", "resource-instance-id": "storage-001", "resource-type": "STORAGE_CLASS", "operation": "link"}
                  Output:
                   {"status":"success","response":{"id":"dp-123","resource-instances":[{"id":"storage-001","type":"STORAGE_CLASS","status":"linked","message":"Successfully linked to data plane"}]},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane to which the resource instances are to be linked. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        resource-instance-id:
          type: string
          description: id of the resource instance to be linked. To check for possible values, use the 'listResourceInstances' tool and show them to the user.
        resource-type:
          type: string
          description: type of the resource instance to be linked. For possible values, use the 'listResources' tool and show them to the user.
        operation:
          type: string
          description: 'operation to be performed. Supported values: ''link'', ''unlink'' '
      required:
        - data-plane-id
        - resource-instance-id
        - resource-type
        - operation
      additionalProperties: false
  - name: listApps
    description: |-
      List applications in a subscription with support of optional filters

      Purpose: To list applications in a subscription with comprehensive filtering options. These filters should be used as much as possible
      This tool provides detailed output, encompassing application-specific data as well as fundamental information about Data Planes, Capability types and Instances, and the Resource Instance Id associated with these applications. It should be sufficient for most needs; invoking other tools is only necessary when detailed resource information is explicitly required.

      Input:
      - dataPlaneId: Optional filter to get applications in specific data plane(s) identified by unique ID(s). Accepts single or multiple IDs as an array
      - dataPlaneName: Optional filter to get applications in specific data plane(s) with name(s). Accepts single or multiple names as an array
      - appName: Optional filter to get details of application(s) by name(s). Accepts single or multiple names as an array
      - appId: Optional filter to get details of application(s) by ID(s). Accepts single or multiple IDs as an array
      - appStatus: Optional filter to get details of applications with specific status(es). Accepts single or multiple statuses as an array
      - capabilityId: Optional filter to get details of applications by specific capability/capabilities. Accepts single or multiple capability IDs as an array
      - resourceInstanceId: Optional filter to get details of applications associated with specific resource instance(s). Accepts single or multiple resource instance IDs as an array
      - namespace: Optional filter to get applications deployed in a specific Kubernetes namespace
      - includeFields: Optional filter to specify which attributes to include in the response. Accepts an array of field names from the output details (e.g., ['app-name', 'app-id', 'app-state', 'data-plane-name']). When provided, only the specified fields will be returned
      - page: Optional page number for pagination
      - limit: Optional limit for pagination
      - orderBy: Optional name of the field to order the results by. Supported values: 'app-description', 'app-id', 'app-name', 'app-state', 'capability-id', 'capability-instance-id', 'capability-instance-description', 'capability-instance-name', 'capability-instance-status', 'created-by', 'created-time', 'data-plane-id', 'data-plane-name', 'data-plane-description', 'data-plane-status', 'host-cloud-type', 'modified-by', 'modified-time', 'registered-region', 'subscription-id'
      - order: Optional sort order. Supported values: 'asc' or 'desc'. Only takes effect when orderBy is provided

      Output: A JSON object containing:
      - data: A list of application details (described below)
      - total-records-in-table: Total number of records returned, to be used for pagination

      Each record in 'data' has the following details:
      - app-description: Description of the application
      - app-eula: Status of the application EULA
      - app-id: Application ID
      - app-links: Links related to the application
      - app-name: Name of the application
      - app-namespace: Namespace of the application
      - app-resource-instance_ids: List of resource instance IDs associated with the application
      - app-state: Status of the application
      - app-tags: Tags associated with the application
      - app-version: Version of the application
      - capability-id: Capability ID of the application
      - capability-instance-description: Description of the capability instance
      - capability-instance-id: Capability instance ID of the application
      - capability-instance-name: Name of the capability instance
      - capability-instance-namespace: Namespace of the capability instance
      - capability-instance-status: Status of the capability instance
      - capability-instance-tags: Tags associated with the capability instance
      - capability-instance-version: Version of the capability instance
      - created-by: User who created the application
      - created-time: Timestamp when the application was created
      - data-plane-description: Description of the dataplane
      - data-plane-id: ID of the dataplane
      - data-plane-name: Name of the dataplane
      - data-plane-status: Status of the dataplane
      - data-plane-tags: Tags associated with the dataplane
      - host-cloud-type: Type of the host cloud where the application is deployed
      - modified-by: User who last updated the application
      - modified-time: Timestamp when the application was last updated
      - registered-region: Region where the application is registered
      - running-region: Region where the application is currently running
      - subscription-id: Subscription ID of the application

      Note: If no filters are provided, all applications in the subscription will be returned.
      Supported values for appStatus filter are: 'Stopped', 'Stopping', 'Running', 'Failure', 'Unknown', 'Deployment Failed', 'Scaling', 'Warning', 'App Not Present in DP'
      Samples:
               - Sample 1 — Success (Single values)
                  Input:
                   {"data-plane-id": ["dp-123"], "capability-id": ["BWCE"], "app-status": ["Running"]}
                  Output:
                   {"status":"success","response":{"data":[{"app-description":"app description","app-eula":true,"app-id":"cuumooaghufnbqb1mtcg","app-links":{},"app-name":"app-name","app-namespace":"app-ns","app-resource-instance-ids":[],"app-state":"Running","app-tags":[],"app-version":[1,0],"capability-id":"BWCE","capability-instance-description":null,"capability-instance-id":"cuumge27dsoajnuj4f6g","capability-instance-name":"BWCE","capability-instance-namespace":"cap-ns","capability-instance-status":"provisioned","capability-instance-tags":null,"capability-instance-version":[1,5,0],"created-by":"username","created-time":1740467298,"data-plane-description":"","data-plane-id":"cuq4rgaugsdfke0k7k4g","data-plane-name":"data-plane-name","data-plane-status":"processed","data-plane-tags":null,"host-cloud-type":"k8s","modified-by":"username","modified-time":1740467343,"registered-region":"global","running-region":"","subscription-id":"cuq4qiqugsdfke0k7k3g"}],"total-records-in-table":1},"context":["2024-11-11T11:04:59.224Z"]}

               - Sample 2 — Success (Multiple values)
                  Input:
                   {"dataPlaneId": ["dp-123", "dp-456"], "appStatus": ["Running", "Stopped"], "capabilityId": ["BWCE", "FLOGO"]}
                  Output:
                   {"status":"success","response":{"data":[...applications from multiple data planes with multiple statuses...],"total-records-in-table":10},"context":["2024-11-11T11:04:59.224Z"]}

               - Sample 3 — Error
                  Input:
                    {"appId": ["app-999"]}
                  Output:
                    {"status": "error","code": "CP-10000","message": "Error summary","details": "Error details","context": ["2025-03-11T04:53:52Z"]
    inputSchema:
      type: object
      properties:
        dataPlaneId:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: id(s) of the data plane to filter applications for the specified data plane(s)'
        dataPlaneName:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: name(s) of the data plane to filter applications for the specified data plane(s)'
        appName:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: name(s) of the application to filter applications by name'
        appId:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: id(s) of the application to filter applications by id'
        appStatus:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: status(es) of the application to filter applications based on their status. Supported values: ''Stopped'', ''Stopping'', ''Running'', ''Failure'', ''Unknown'', ''Deployment Failed'', ''Scaling'', ''Warning'', ''App Not Present in DP'''
        capabilityId:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: id(s) of the capability to filter applications for the specified capability. To check for possible values, use the ''getCapabilitiesMetadata'' tool. '
        resourceInstanceId:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: id(s) of the resource instance to filter applications associated with the specified resource instance(s)'
        namespace:
          type: string
          description: 'Optional: filter applications by Kubernetes namespace name. Only apps deployed in the specified namespace will be returned.'
        includeFields:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: list of attribute names to include in the response. Only the specified fields will be returned. Accepted values are from the output fields of this tool such as ''app-name'', ''app-id'', ''app-state'', ''data-plane-id'', ''data-plane-name'', etc.'
        page:
          type: integer
          description: 'Optional: page number for pagination'
        limit:
          type: integer
          description: 'Optional: limit for pagination'
        orderBy:
          type: string
          description: 'Optional: name of the field to order the results by. Supported values: ''app-description'', ''app-id'', ''app-name'', ''app-state'', ''capability-id'', ''capability-instance-id'', ''capability-instance-description'', ''capability-instance-name'', ''capability-instance-status'', ''created-by'', ''created-time'', ''data-plane-id'', ''data-plane-name'', ''data-plane-description'', ''data-plane-status'', ''host-cloud-type'', ''modified-by'', ''modified-time'', ''registered-region'', ''subscription-id''.'
        order:
          type: string
          description: 'Optional: sort order. Supported values: ''asc'' or ''desc''. Only takes effect when orderBy is provided.'
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: listCapabilityInstances
    description: "List details of multiple capability instances in a subscription with support of optional filters\n\nPurpose: To list details of multiple capability instances in a subscription with comprehensive filtering options. These filters should be used as much as possible\nThis tool provides detailed output, encompassing capability instances data as well as fundamental information about Data Planes and the Resource Instance Id associated with these capability instances. It should be sufficient for most needs; invoking other tools is only necessary when detailed resource information is explicitly required.\n\nInput:\n- dataPlaneId: Optional filter to get capability instances in specific data plane(s) identified by unique ID(s). Accepts single or multiple IDs as an array\n- dataPlaneName: Optional filter to get capability instances in specific data plane(s) with name(s). Accepts single or multiple names as an array\n- capabilityId: Optional filter to get capability instances of specific capabilityId(s). Accepts single or multiple capability IDs as an array\n- capabilityInstanceId: Optional filter to get specific capability instance(s) identified by unique ID(s). Accepts single or multiple IDs as an array\n- includeFields: Optional filter to specify which attributes to include in the response. Accepts an array of field names from the output details (e.g., ['capability-instance-id', 'capability-instance-name', 'capability-id', 'status']). When provided, only the specified fields will be returned\n- status: Optional filter to get capability instances by status(es). Accepts single or multiple statuses as an array. Supported values are: 'red','amber' and 'green' \n- page: Optional page number for pagination\n- limit: Optional limit for pagination\n- orderBy: Optional name of the field to order the results by. Supported values: 'data-plane-id', 'data-plane-name', 'capability-instance-id', 'capability-instance-name', 'capability-id', 'type', 'description', 'created-by', 'created-time', 'modified-by', 'modified-time', 'region', 'status'\n- order: Optional sort order. Supported values: 'asc' or 'desc'. Only takes effect when orderBy is provided\n\nOutput: A JSON object containing:\n- data: A list of capability instance details (described below)\n- total-records-in-table: Total number of records returned, to be used for pagination\n\nEach record in 'data' has the following details:\n- data-plane-id: The ID of the data plane with which it is associated\n- data-plane-name: The name of the data plane with which it is associated\n- capability-instance-id: The ID of the capability instance\n- capability-instance-name: The name of the capability instance\n- capability-id: The ID of the capability associated with the instance\n- type: Internal type of the capability instance used in the backend\n- description: A description of the capability instance\n- created-by: The user who created the capability instance\n- created-time: The timestamp when the capability instance was created\n- modified-by: The user who last updated the capability instance\n- modified-time: The timestamp when the capability instance was last updated\n- namespace: The namespace where the capability instance is located\n- region: The region where the capability instance is located\n- tags: A list of tags associated with the capability instance\n- version: The version of the capability instance\n- latest-version-available: The version available to upgrade the capability instance to. If the latest version is installed then version and latest-version-available will be same\n- resource-instances: A list of resource instances associated with the capability instance, each containing:\n\t- id: The ID of the resource instance.\n\t- name: The name of the resource instance.\n- status: The status of the capability instance\n- services: A list of services associated with the capability instance, each containing:\n  - name: The name of the service\n  - status: The status of the service\n  - message: A message providing additional information about the service status\n\nNote: If no filters are provided, all capability instances in the subscription will be returned.\ncapabilityId supported in the input as a filter can also be considered as type or capability for the end user and should be used accordingly in the user queries. This is not to be mixed with type in the output as that is for internal representation only.\nExample: To retrieve all BWCE instances, set capabilityId to \"BWCE\" in your input\n\nSamples:\n         - Sample 1 — Success\n            Input:\n             {\"dataPlaneId\": [\"dp-123\"], \"capabilityId\": [\"BWCE\"], \"capabilityInstanceId\": [\"ci-001\"], \"page\": 1, \"limit\": 10}\n            Output:\n\t\t     {\"status\":\"success\",\"context\":[\"2024-11-11T11:04:59.224Z\"],\"response\":{\"data\":[{\"data-plane-id\":\"dp-123\",\"data-plane-name\":\"Production DataPlane\",\"capability-instance-id\":\"ci-001\",\"capability-instance-name\":\"BWCE Instance 1\",\"capability-id\":\"BWCE\",\"type\":\"BWCE\",\"description\":\"BusinessWorks Container Edition instance\",\"created-by\":\"admin\",\"created-time\":\"2024-12-01T10:30:00Z\",\"modified-by\":\"admin\",\"modified-time\":\"2024-12-15T14:20:00Z\",\"namespace\":\"default\",\"region\":\"us-east-1\",\"tags\":\"\",\"version\":\"1.0.0\",\"latest-version-available\":\"1.1.0\",\"resource-instances\":[{\"id\":\"cuumg7a7dsoajnuj4f5g\",\"name\":\"storage-resource\"},{\"id\":\"cuumgaa7dsoajnuj4f60\",\"name\":\"ingress-resource\"}],\"status\":\"Running\",\"services\":[{\"name\":\"bwce-service\",\"status\":\"Running\",\"message\":\"Service is healthy\"}]}],\"total-records-in-table\":1}}\n\n         - Sample 2 — Error\n            Input:\n              {\"capabilityInstanceId\": [\"ci-999\"]}\n            Output:\n              {\"status\": \"error\",\"code\": \"CP-10000\",\"message\": \"Error summary\",\"details\": \"Error details\",\"context\": [\"2025-03-11T04:53:52Z\"]"
