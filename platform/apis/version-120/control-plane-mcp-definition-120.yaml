  - name: manageDataPlane
    description: |-
      Update or upgrade an existing data plane

      Purpose: This tool is used to update the details of an existing data plane, switch routes, or upgrade all capabilities on a data plane.
      It supports three mutually exclusive operations:
      1. Metadata update: Updates basic metadata (name, description, tags)
      2. Route switching: Switches routes for Control Tower data planes
      3. Upgrade: Upgrades all capabilities on a Kubernetes data plane to their latest available versions
      For metadata updates, only provide the fields that need to be changed. Fields that are omitted will remain unchanged.

      Input:
      - data-plane-id: The unique identifier of the data plane to be updated
      - name: Optional new name for the data plane
      - description: Optional new description for the data plane
      - tags: Optional new tags for the data plane
      - route-resource-instance-id: Optional. The id of the new route resource instance (ingress controller or gateway) to switch to. Supported only for Control Tower data planes when switching routes.
      - upgrade: Optional. Set to true to upgrade all capabilities on this data plane to their latest available versions.

      Output: The result of the data plane update including:
      - For metadata update: id, name, description, tags of the updated data plane
      - For route switching: A success message confirming the route resource was switched successfully
      - For upgrade: A list of upgraded capabilities with their from/to versions and any failed capabilities

      Note: The three operations (metadata update, route switching, upgrade) are mutually exclusive. The tool should be used to perform only one operation at a time.
       For the update calls only fields to be changed are expected in the input/payload

      Samples:
               - Sample 1 — Success (metadata update)
                  Input:
                   {"data-plane-id": "dp-123", "name": "updated-production-cluster", "description": "Updated production Kubernetes cluster", "tags": ["production", "updated", "critical"]}
                  Output:
                   {"status":"success","response":{"id":"dp-123","name":"updated-production-cluster","description":"Updated production Kubernetes cluster","tags":["production","updated","critical"]},"context":["2025-01-01T00:00:00Z"]}

               - Sample 2 — Success (route switching for Control Tower data plane)
                  Input:
                   {"data-plane-id": "dp-456", "route-resource-instance-id": "d70e5v4o2qtc73bf2e0g"}
                  Output:
                   {"status":"success","response":{"message":"Route resource d70e5v4o2qtc73bf2e0g switched successfully"},"context":["2025-01-01T00:00:00Z"]}

               - Sample 3 — Success (upgrade data plane)
                  Input:
                   {"data-plane-id": "dp-789", "upgrade": true}
                  Output:
                   {"status":"success","response":{"message":"Upgrade initiated for 3 capability(ies)","upgradedCapabilities":[{"capabilityId":"CPPROXY","capabilityInstanceId":"d6a8d94l3frc73c5m8hg","fromVersion":"1.14.0","toVersion":"1.15.0","message":"Successfully updated capability instance"},{"capabilityId":"MONITORINGAGENT","capabilityInstanceId":"d6a8d7sl3frc73c5m8h0","fromVersion":"1.14.0","toVersion":"1.15.0","message":"Successfully updated capability instance"},{"capabilityId":"O11Y","capabilityInstanceId":"d6a8disl3frc73c5m8i0","fromVersion":"1.14.0","toVersion":"1.15.0","message":"Successfully updated capability instance"}],"failedCapabilities":[]},"context":["2025-01-01T00:00:00Z"]}

               - Sample 4 — Success (partial metadata update — only change name)
                  Input:
                   {"data-plane-id": "dp-123", "name": "new-cluster-name"}
                  Output:
                   {"status":"success","response":{"id":"dp-123","name":"new-cluster-name","description":"Existing description unchanged","tags":["existing","tags"]},"context":["2025-01-01T00:00:00Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane to be updated. To check for possible values, use the 'listDataplanes' tool and show them to the user.
        name:
          type:
            - "null"
            - string
          description: 'Optional: New name for the data plane'
        description:
          type:
            - "null"
            - string
          description: 'Optional: New description for the data plane'
        tags:
          type:
            - "null"
            - array
          items:
            type: string
          description: 'Optional: New tags for the data plane'
        route-resource-instance-id:
          type: string
          description: 'Optional: id of the new route resource instance (ingress controller or gateway) to switch to. Required only for Control Tower data planes when switching routes. To check for possible values, use the ''listResourceInstances'' tool with resourceType filter as ''INGRESS_CONTROLLER'' or ''GATEWAYAPI''.'
        upgrade:
          type: boolean
          description: 'Optional: Set to true to upgrade all capabilities on this Kubernetes data plane to their latest available versions. This is mutually exclusive with other update operations.'
      required:
        - data-plane-id
      additionalProperties: false
