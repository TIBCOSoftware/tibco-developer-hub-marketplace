  - name: listLicenseDetails
    description: |-
      Fetch license details for a subscription with optional scope filters

      Purpose: To retrieve license information configured . The response includes license file metadata, expiration dates, capability-level entitlements (FTL, BW, EMS, RV, etc.), and host identifiers.

      Input:
      - dataPlaneId: Optional filter to fetch license details for a specific data plane. Mutually exclusive with 'global'.
      - global: Optional boolean flag. When true, fetches only the global (subscription-level) license. Mutually exclusive with 'dataPlaneId'.

      Note: If neither 'dataPlaneId' nor 'global' is provided, all licenses in the subscription are returned.

      Output: A JSON object containing:
      - response: A list of license entries, each including:
        - scope: License scope (e.g., 'SUBSCRIPTION' or 'DATAPLANE')
        - scope_id: Identifier of the scope (subscription id or data plane id)
        - file_name: Name of the uploaded license file
        - license_file: Encoded license file content
        - license_metadata: Decoded license metadata including ENTERPRISE_ID, LICENSE entries (with EXPIRATION, LICENSE_NAME, LICENSE_VERSION, SERIAL_NUMBER, etc.), MACHINE_TYPE, SERVER_ID and source identifiers
        - modified_date: Last modification timestamp (Unix seconds)
        - linked_data_planes: Data planes linked to this license (if any)

      Samples:
               - Sample 1 — Success (all licenses in subscription)
                  Input:
                   {}
                  Output:
                   {"status":"success","response":[{"scope":"SUBSCRIPTION","scope_id":"d7pm0252sbvs73amckc0","file_name":"license.bin","license_file":"...","license_metadata":{"ENTERPRISE_ID":"957","LICENSE":[{"LICENSE_NAME":"TIBCO_FTL_CCS","EXPIRATION":"2026-08-31","SERIAL_NUMBER":"LA-T228628-42454","expired":false}]},"modified_date":1778227131,"linked_data_planes":null}],"context":["2026-05-08T08:01:43.454Z"]}

               - Sample 2 — Success (specific data plane)
                  Input:
                   {"dataPlaneId": "dp-123"}
                  Output:
                   {"status":"success","response":[{"scope":"DATAPLANE","scope_id":"dp-123","file_name":"license.bin","license_metadata":{...}}],"context":["2026-05-08T08:01:43.454Z"]}

               - Sample 3 — Success (global only)
                  Input:
                   {"global": true}
                  Output:
                   {"status":"success","response":[{"scope":"SUBSCRIPTION","scope_id":"d7pm0252sbvs73amckc0","license_metadata":{...}}],"context":["2026-05-08T08:01:43.454Z"]}

               - Sample 4 — Error
                  Input:
                    {"dataPlaneId": "dp-999"}
                  Output:
                    {"status": "error","code": "CP-10000","message": "Error summary","details": "Error details","context": ["2026-05-08T04:53:52Z"]}
    inputSchema:
      type: object
      properties:
        dataPlaneId:
          type: string
          description: 'Optional: id of the data plane to fetch license details for. Mutually exclusive with ''global''. If neither is provided, all licenses in the subscription are returned. To check for possible values, use the ''listDataplanes'' tool.'
        global:
