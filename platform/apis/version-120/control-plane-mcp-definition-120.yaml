    description: "List all possible resources available in platform and their supported types where applicable \n\nPurpose: To get all resources available in the platform which can be used to create instances of resources \n\nInput: No input parameters are required for this tool \n\nReturns: List of resources including :\n- id: Unique identifier for the resource type\n- name: Human-readable name for the resource\n- supportedTypes: For route resource types (INGRESS_CONTROLLER, GATEWAYAPI), the list of supported controller implementations (e.g. nginx, kong, traefik, GKE, Istio). Absent for other resource types. \n\nNote: This does not return the instances of the resources, but only the types of resources available in the platform.Samples:\n         - Sample 1 — Success\n            Input:\n             {}\n            Output:\n             {\"status\":\"success\",\"response\":[{\"id\":\"INGRESS_CONTROLLER\",\"name\":\"Ingress Controller\",\"supportedTypes\":[\"nginx\",\"kong\",\"traefik\",\"openshiftRouter\",\"haProxy\"]},{\"id\":\"GATEWAYAPI\",\"name\":\"Gateway API\",\"supportedTypes\":[\"nginx\",\"GKE\",\"Istio\",\"traefik\",\"Other GatewayAPI Controller\",\"NetScaler\"]},{\"id\":\"STORAGE_CLASS\",\"name\":\"Storage Class\"},{\"id\":\"EMAIL_RECEIVER\",\"name\":\"Email Receiver\"}],\"context\":[\"2025-01-01T00:00:00Z\"]}"
