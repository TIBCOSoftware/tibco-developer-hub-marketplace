    description: "Provision or update a TibcoHub capability inside the given data plane\n\nPurpose: This tool provisions a new TibcoHub capability instance or updates an existing one inside a specified data plane.\nIf capability-instance-id is provided, the existing capability instance is updated; otherwise, a new one is provisioned.\nFor updates, only provide the fields that need to be changed. Fields that are omitted will remain unchanged.\n\nInput:\n- data-plane-id: The ID of the data plane where the TibcoHub capability instance will be provisioned or updated.\n- capability-instance-id: Optional. The ID of the capability instance to update. If omitted, a new instance is provisioned.\n- provision-schema: The schema containing the details required to provision or update the TibcoHub capability. This includes:\n\t- storage-class-resource-instance-id: Optional The ID of the storage class resource instance. Required for provisioning (if not using database-resource-instance-id), must not be provided for update.\n\t- ingress-controller-resource-instance-id: Optional ID of the ingress controller resource instance to be used by the TibcoHub capability. This is only needed if user wants to use ingress controller instead of gateway \n\t- gateway-resource-instance-id: Optional ID of the gateway resource instance to be used by the TibcoHub capability. This is only needed if user wants to use gateway instead of ingress controller \n\t- database-resource-instance-id: Optional ID of the database resource instance to be used.\n\t- configuration: Configurations needed for provisioning or updating TibcoHub capability. Required for create, optional for update. These include:\n\t\t- developer-hub-name: The name of the developer hub.\n\t- advanced: Optional advanced configurations for the TibcoHub capability instance. These include:\n\t\t- kubernetes-secret-object: Optional Name of the kubernetes secret\n\t- custom-config: Optional String representation of configuration yaml to override the default configuration\n\nOutput:\n- For provisioning: The details of the provisioned TibcoHub capability instance, including:\n\t- capabilityInstanceId: The ID of the provisioned capability instance.\n\t- releasesStatus: A list of release statuses, each containing name, namespace, releaseName, revision, status, and error.\n\t- successfulReleases: A list of successfully deployed releases with the same structure.\n- For update: A success message confirming the capability instance was updated.\n\nNote: The ingress-controller-resource-instance-id and gateway-resource-instance-id are mutually exclusive. Only one of them is needed based on whether user wants to use ingress controller or gateway.\nThe database-resource-instance-id and storage-class-resource-instance-id are mutually exclusive. Only one of them is needed for provisioning.\nIf user wants to use default db to be provisioned by platform specify storage-class-resource-instance-id.\nIf user wants to use an existing db instance then specify database-resource-instance-id.\nMake sure one of them is always present in the input for provisioning. \n\nSamples:\n         - Sample 1 — Success (provision)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"provision-schema\": {\"storage-class-resource-instance-id\": \"storage-001\", \"ingress-controller-resource-instance-id\": \"ingress-001\", \"configuration\": {\"developer-hub-name\": \"my-dev-hub\"}, \"advanced\": {\"kubernetes-secret-object\": \"my-secret\"}}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"capabilityInstanceId\":\"tibcohub-inst-001\",\"releasesStatus\":[{\"name\":\"tibcohubprovisioner\",\"namespace\":\"ns-001\",\"releaseName\":\"tibcohubprovisioner-tibcohub-inst-001\",\"revision\":1,\"status\":\"deployed\",\"error\":\"\"}],\"successfulReleases\":[{\"name\":\"tibcohubprovisioner\",\"namespace\":\"ns-001\",\"releaseName\":\"tibcohubprovisioner-tibcohub-inst-001\",\"revision\":1,\"status\":\"deployed\",\"error\":\"\"}]},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 2 — Success (update)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"capability-instance-id\": \"tibcohub-inst-001\", \"provision-schema\": {\"ingress-controller-resource-instance-id\": \"ingress-001\", \"database-resource-instance-id\": \"db-001\", \"configuration\": {\"developer-hub-name\": \"my-dev-hub-updated\"}, \"advanced\": {\"kubernetes-secret-object\": \"my-secret\"}, \"custom-config\": \"key: value\"}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Successfully updated capability instance 'tibcohub-inst-001' on dataplane 'dp-123'\"},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 3 — Success (partial update — only change configuration)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"capability-instance-id\": \"tibcohub-inst-001\", \"provision-schema\": {\"configuration\": {\"developer-hub-name\": \"my-dev-hub-v2\"}}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Successfully updated capability instance 'tibcohub-inst-001' on dataplane 'dp-123'\"},\"context\":[\"2025-01-01T00:00:00Z\"]}"
    inputSchema:
