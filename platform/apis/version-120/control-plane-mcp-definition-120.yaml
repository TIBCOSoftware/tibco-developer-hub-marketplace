  - name: manageCapabilityInstance
    description: |-
      Upgrade or refresh a capability instance inside the given data plane

      Purpose: This tool upgrades an existing capability instance to a specified version or refreshes it inside a data plane.
               Refresh again deploys the concrete recipe for capability on the data plane. This is useful when user wants to re-deploy the capability with same version for scenarios like helm repo is updated, changes done to activation server,license file updated etc.
      If capability-version is provided, the capability instance is upgraded to that version.
      If capability-version is omitted, the capability instance is refreshed.

      Input:
      - data-plane-id: The ID of the data plane where the capability instance is located.
      - capability-instance-id: The ID of the capability instance to upgrade or refresh.
      - capability-version: Optional. The target version to upgrade the capability instance to. If omitted, a refresh is performed instead.

      Output: The result of the upgrade or refresh operation, including:
      - message: A message indicating the result of the operation.

      Samples:
               - Sample 1 — Success (upgrade)
                  Input:
                   {"data-plane-id": "dp-123", "capability-instance-id": "bwce-inst-001", "capability-version": "1.16.0"}
                  Output:
                   {"status":"success","response":{"message":"Upgrade initiated for capability instance bwce-inst-001"},"context":["2025-01-01T00:00:00Z"]}

               - Sample 2 — Success (refresh)
                  Input:
                   {"data-plane-id": "dp-123", "capability-instance-id": "d7s65dd2sbvs73amckpg"}
                  Output:
                   {"status":"success","response":{"message":"Successfully refreshed capability instance 'd7s65dd2sbvs73amckpg' on dataplane 'dp-123'"},"context":["2026-05-05T04:04:54.317Z"]}
    inputSchema:
      type: object
      properties:
        data-plane-id:
          type: string
          description: id of the data plane where the capability instance is located. To check for possible values, use the 'listDataplanes' tool.
        capability-instance-id:
          type: string
          description: id of the capability instance to be upgraded or refreshed. To get this id, use the 'listCapabilityInstances' tool.
        capability-version:
          type: string
          description: 'Optional: target version to upgrade the capability instance to. If omitted, the tool performs a refresh instead of an upgrade. To check for possible values, use the ''getCapabilitiesMetadata'' tool.'
      required:
        - data-plane-id
        - capability-instance-id
      additionalProperties: false
