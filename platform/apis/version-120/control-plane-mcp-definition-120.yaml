  - name: manageAlertRule
    description: |-
      Create or update an alert rule to monitor resources and send notifications

      Purpose: To create a new alert rule or update an existing one that monitors resources and sends notifications when triggered

      Behaviour:
      - If 'resource-instance-id' is omitted, a new alert rule is created (name, dp-id, capability-id, severity, config-details and alert-receiver-id are required)
      - If 'resource-instance-id' is provided, the existing alert rule is updated
      - For updates, only provide the fields that need to be changed. Fields that are omitted will remain unchanged on the server.
      - For partial updates of 'config-details', include only the sub-fields you want to change; omitted sub-fields stay unchanged.
      - To enable/disable an existing rule without changing anything else, provide only 'resource-instance-id' and 'is-enabled' ('true' or 'false').

      Input: ManageAlertRuleInput with the following fields:
      - resource-instance-id: (Optional) ID of the alert rule resource instance to update. To get this id, use the 'listResourceInstances' tool with resourceType 'ALERT_RULE'
      - is-enabled: (Optional) Flag to enable or disable an existing alert rule. Possible values are 'true' or 'false'. Default value should be ''
      - name: Name of the alert rule (required for create, optional for update)
      - description: (Optional) Description of the alert rule
      - alert-message: (Optional) Message to be sent when the alert is triggered
      - dp-id: ID of the data plane to which the alert rule is applied (required for create, optional for update)
      - capability-id: ID of the capability to which the alert rule is applied (required for create, optional for update)
      - severity: Severity of the alert (e.g., critical, warning, info) (required for create, optional for update)
      - config-details: Configuration details for the alert rule (required for create, optional for update)
      - alert-receiver-id: ID of the alert receiver to which the alert is sent when triggered (required for create, optional for update)

      Returns: Id of the created or updated resource
      - resource_instance_id : Unique identifier for the alert rule resource instance

      Note: Alert rule is a type of Resource known to the Control Plane as 'ALERT_RULE' and is created only at the subscription level.
       For update calls, only fields to be changed are expected in the input/payload.

      Samples:
               - Sample 1 — Create (no resource-instance-id)
                  Input:
                   {"name": "High CPU Alert", "description": "Monitor CPU usage", "alert-message": "CPU usage exceeded threshold", "dp-id": "dp-123", "capability-id": "BWCE", "severity": "critical", "config-details": {"alert-rule-category": "CpuLimit", "alert-rule-operator": ">=", "alert-rule-time": "5", "alert-rule-value": "80", "alert-time-range": "10"}, "alert-receiver-id": "email-rec-001"}
                  Output:
                   {"status":"success","response":{"resource_instance_id":"alert-rule-001"},"context":["2025-01-01T00:00:00Z"]}
               - Sample 2 — Update top-level fields (with resource-instance-id)
                  Input:
                   {"resource-instance-id": "d86l8fmopu3c73abr7dg", "name": "alert-ruled", "severity": "warning", "alert-receiver-id": "d86kh6mopu3c73abr7ag"}
                  Output:
                   {"status":"success","response":{"resource_instance_id":"d86l8fmopu3c73abr7dg"},"context":["2025-01-01T00:00:00Z"]}
               - Sample 3 — Partial update of config-details only (only change alert-rule-time)
                  Input:
