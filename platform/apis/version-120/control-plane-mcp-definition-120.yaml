  - name: manageCapabilityBW5CE
    description: "Provision or update a bw5ce capability inside the given data plane\n\nPurpose: This tool provisions a new bw5ce capability instance or updates an existing one inside a specified data plane.\nIf capability-instance-id is provided, the existing capability instance is updated; otherwise, a new one is provisioned.\nFor updates, only provide the fields that need to be changed. Fields that are omitted will remain unchanged.\n\nInput:\n- data-plane-id: The ID of the data plane where the bw5ce capability instance will be provisioned or updated.\n- capability-instance-id: Optional. The ID of the capability instance to update. If omitted, a new instance is provisioned.\n- provision-schema: The schema containing the details required to provision or update the bw5ce capability instance. This includes:\n\t- path-prefix: The path prefix for the bw5ce capability instance. Required for create, optional for update.\n\t- storage-class-resource-instance-id: The ID of the storage class resource instance. Required for provisioning, must not be provided for update.\n\t- ingress-controller-resource-instance-id: Optional ID of the ingress controller resource instance to be used by the bw5ce capability. This is only needed if user wants to use ingress controller instead of gateway \n\t- gateway-resource-instance-id: Optional ID of the gateway resource instance to be used by the bw5ce capability. This is only needed if user wants to use gateway instead of ingress controller \n\t- fluentbit-sidecar-enabled: A boolean indicating whether the Fluent Bit sidecar to be enabled which is used for centralized logging. Required for create, optional for update.\n\nOutput:\n- For provisioning: The details of the provisioned bw5ce capability instance, including:\n\t- capabilityInstanceId: The ID of the provisioned capability instance.\n\t- releasesStatus: A list of release statuses, each containing name, namespace, releaseName, revision, status, and error.\n\t- successfulReleases: A list of successfully deployed releases with the same structure.\n- For update: A success message confirming the capability instance was updated.\n\nNote: The ingress-controller-resource-instance-id and gateway-resource-instance-id are mutually exclusive. Only one of them is needed based on whether user wants to use ingress controller or gateway.\n For the update calls only fields to be changed are expected in the input/payload\n\nSamples:\n         - Sample 1 — Success (provision)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"provision-schema\": {\"path-prefix\": \"/bw5ce\", \"storage-class-resource-instance-id\": \"storage-001\", \"ingress-controller-resource-instance-id\": \"ingress-001\", \"fluentbit-sidecar-enabled\": true}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"capabilityInstanceId\":\"bw5ce-inst-001\",\"releasesStatus\":[{\"name\":\"bw5ceprovisioner\",\"namespace\":\"ns-001\",\"releaseName\":\"bw5ceprovisioner-bw5ce-inst-001\",\"revision\":1,\"status\":\"deployed\",\"error\":\"\"}],\"successfulReleases\":[{\"name\":\"bw5ceprovisioner\",\"namespace\":\"ns-001\",\"releaseName\":\"bw5ceprovisioner-bw5ce-inst-001\",\"revision\":1,\"status\":\"deployed\",\"error\":\"\"}]},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 2 — Success (update)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"capability-instance-id\": \"bw5ce-inst-001\", \"provision-schema\": {\"path-prefix\": \"/bw5ce\", \"ingress-controller-resource-instance-id\": \"ingress-001\", \"fluentbit-sidecar-enabled\": false}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Successfully updated capability instance 'bw5ce-inst-001' on dataplane 'dp-123'\"},\"context\":[\"2025-01-01T00:00:00Z\"]}\n\n         - Sample 3 — Success (partial update — only change fluentbit setting)\n            Input:\n             {\"data-plane-id\": \"dp-123\", \"capability-instance-id\": \"bw5ce-inst-001\", \"provision-schema\": {\"fluentbit-sidecar-enabled\": false}}\n            Output:\n             {\"status\":\"success\",\"response\":{\"message\":\"Successfully updated capability instance 'bw5ce-inst-001' on dataplane 'dp-123'\"},\"context\":[\"2025-01-01T00:00:00Z\"]}"
