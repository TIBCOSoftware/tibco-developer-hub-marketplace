  - name: listDataplanes
    description: "List data planes in a subscription with support of optional filters\n\nPurpose: To list data planes in a subscription with comprehensive filtering options. These filters should be used as much as possible\nThis tool provides detailed output, encompassing data plane-specific data as well as fundamental information about Capability types and Instances associated with these data planes. It should be sufficient for most needs; invoking other tools is only necessary when detailed resource information is explicitly required.\n\nInput:\n- dataPlaneId: Optional filter to get details of specific data plane(s) identified by unique ID(s). Accepts single or multiple IDs as an array\n- dataPlaneName: Optional filter to get details of specific data plane(s) by name(s). Accepts single or multiple names as an array\n- dataPlaneType: Optional filter to get data planes by type(s). Accepts single or multiple types as an array. Supported values: 'k8s' or 'control-tower'\n- includeFields: Optional filter to specify which attributes to include in the response. Accepts an array of field names from the output details (e.g., ['data-plane-id', 'name', 'status', 'capabilities']). When provided, only the specified fields will be returned\n- status: Optional filter to get data planes by status(es). Accepts single or multiple statuses as an array. Supported values are: 'red','amber' and 'green' \n- page: Optional page number for pagination\n- limit: Optional limit for pagination\n- orderBy: Optional name of the field to order the results by. Supported values: 'data-plane-name', 'data-plane-id', 'data-plane-description', 'host-cloud-type', 'registered-region', 'status'\n- order: Optional sort order. Supported values: 'asc' or 'desc'. Only takes effect when orderBy is provided\n\nOutput: A JSON object containing:\n- data: A list of data plane details (described below)\n- total-records-in-table: Total number of records returned, to be used for pagination\n\nEach record in 'data' has the following details:\n- data-plane-id: Unique identifier of the data plane\n- data-plane-name: Name of the data plane\n- status: Status of the data plane\n- message: Additional message or information about the data plane status\n- tibtunnel-connected: Indicates if the Tibco tunnel is connected for the data plane\n- cluster-scoped-permissions: Indicates if the data plane has cluster-scoped permissions\n- data-plane-description: Description of the data plane\n- fluent-bit: Fluent Bit is enabled or disabled for the data plane\n- host-cloud-type: Type of the data plane\n- namespace: The namespace of the data plane\n- registered-region: The region where the data plane is registered\n- service-account-name: The name of the service account associated with the data plane\n- tags: Tags associated with the data plane\n- custom-certificate-secret-name: The name of the custom certificate secret for the data plane. This is only present in response if being set while creating the Data plane\n- proxy-config: Proxy configuration for the data plane. This is only present in response if being set while creating the Data plane\n- container-registry: The container registry used by the data plane, including:\n  - url: The URL of the container registry\n  - repository: The repository in the container registry\n  - username: The username for accessing the container registry\n  - password: The redacted password for accessing the container registry.\n- capabilities: List of capabilities of the data plane, each including:\n  - id: Unique identifier of the capability(also referred as capability-instance id in some cases)\n  - name: Name of the capability\n  - capability-id: Type of the capability (also referred as capability, type for other tools)\n\nNote: If no filters are provided, all data planes in the subscription will be returned.\nSamples:\n         - Sample 1 — Success (Single values)\n            Input:\n             {\"dataPlaneId\": [\"dp-123\"], \"dataPlaneType\": [\"k8s\"]}\n            Output:\n             {\"status\":\"success\",\"response\":{\"data\":[{\"data-plane-id\":\"crgnkdp90k6c73d0erf0\",\"data-plane-name\":\"Production DataPlane\",\"status\":\"red\",\"message\":\"Last heard status at 2024-09-11 11:08:40 +0000 UTC\",\"tibtunnel-connected\":false,\"cluster-scoped-permissions\":\"true\",\"data-plane-description\":\"Production environment data plane\",\"fluent-bit\":\"enabled\",\"host-cloud-type\":\"AWS\",\"namespace\":\"default\",\"registered-region\":\"us-east-1\",\"service-account-name\":\"dataplane-sa\",\"tags\":[\"production\"],\"custom-certificate-secret-name\":\"custom-cert\",\"proxy-config\":\"{}\",\"container-registry\":{\"url\":\"https://registry.example.com\",\"repository\":\"tibco\",\"username\":\"user\",\"password\":\"pass\"},\"capabilities\":[{\"id\":\"cap-001\",\"name\":\"BWCE\",\"capability-id\":\"BWCE\"}]}],\"total-records-in-table\":1},\"context\":[\"2024-11-11T11:04:59.224Z\"]}\n\n         - Sample 2 — Success (Multiple values)\n            Input:\n             {\"dataPlaneId\": [\"dp-123\", \"dp-456\"], \"dataPlaneType\": [\"k8s\", \"control-tower\"]}\n            Output:\n             {\"status\":\"success\",\"response\":{\"data\":[...data planes from multiple IDs and types...],\"total-records-in-table\":10},\"context\":[\"2024-11-11T11:04:59.224Z\"]}\n\n         - Sample 3 — Error\n            Input:\n              {\"dataPlaneId\": [\"dp-999\"]}\n            Output:\n              {\"status\": \"error\",\"code\": \"CP-10000\",\"message\": \"Error summary\",\"details\": \"Error details\",\"context\": [\"2025-03-11T04:53:52Z\"]"
