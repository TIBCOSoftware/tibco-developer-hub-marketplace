  - name: bw_scale_app
    description: |-

      Name / Purpose:

      Scale the BW app (deployment) to desired replicas for a given app (deployment) name or id
      Output / Returns:
      - success or failure code(201) and message once scale request is submitted

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to scale app instances for, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to scale app instances for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to scale app instances from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to scale app instances from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to scale instances for. Either app id or app name is required. use 'listApps' tool to list available apps from dataplane
      - AppName (string, optional): The name of the app to scale instances for. Either app id or app name is required. use 'listApps' tool to list available apps from dataplane
      - Replicas (int, required): The desired number of replicas to scale the app to, should be be greater than or equal to 0
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
          description: Optional, name of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        replicas:
          type: integer
          description: Required, number of replicas to scale the application instances to,  should be greater than or equal to 0
      required:
        - baseInput
        - replicas
      additionalProperties: false
