  - name: bw_run_osgi_command
    description: |-

      Name / Purpose:

      Run a read-only TIBCO BusinessWorks OSGi console command against a running instance of the specified BW/BWCE app on a dataplane, to inspect or debug the app's runtime for root-cause analysis (e.g. thread dumps, engine/process/activity/endpoint/resource/component/library listings and diagnostics). Only a fixed allowlist of read-only diagnostic commands is permitted; commands that start, stop, pause, resume, install, uninstall, update, delete, load, set log levels, or otherwise change application/engine state are blocked. The command is dispatched to the app engine only when the target instance is in the Running state

      Output / Returns:
      - the raw text output of the OSGi command as returned by the app engine

      Arguments / Parameters:
      - Command (string, required): The read-only OSGi console command to run, optionally followed by arguments (e.g. 'td' for a thread dump, 'lb' to list bundles, 'le' for engine info). Allowed commands (command - what it does):
        appnodeprocessinfo - show AppNode system process info (PID, uptime, CPU and memory usage)
        dsr - diagnose shared resource issues detected by the engine
        getcomps - list the application components running in the AppNode
        la - list all deployed applications and their state
        lais - list activity execution statistics
        lapi - show detail for a specific process (job) instance
        lapis - list a summary of active process (job) instances
        las - list currently instantiated activities
        lat - list registered activity types
        lb - list all OSGi bundles and their state
        lbwes - list BW statistics event subscribers
        le - show BW engine information (name, state, threads)
        lendpoints - list the endpoints exposed by the engine
        les - list currently instantiated event sources
        ll - list all shared/module libraries
        lloggers - list configured loggers and their levels
        lmetrics - show job metrics for the engine
        lp - list the BW processes known to the engine
        lpis - list process (job) statistics
        lrhandlers - list resource handlers
        lrproxies - list resource proxies
        td - capture a full thread dump of the engine JVM
      Any other command (including state-changing ones) is rejected
      - CapabilityInstanceId (string, optional): The ID of the capability instance to run the command on, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to run the command for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to run the command on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to run the command on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to run the command for, Either app id or name is required, use 'listApps' tool to list available applications
      - AppName (string, optional): The name of the app to run the command for, Either app id or name is required, use 'listApps' tool to list available applications
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
