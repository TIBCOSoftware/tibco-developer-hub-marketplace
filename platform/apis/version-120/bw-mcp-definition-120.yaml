serverInfo:
  name: BWMCPServer
  title: BW MCP Server
  version: 1.20.0
capabilities:
  logging: {}
  tools:
    listChanged: true
tools:
  - name: bw_capture_app_thread_dump
    description: |-

      Name / Purpose:

      Capture thread dump for the specified BW app to analyze performance issues or deadlocks

      Output / Returns:
      - the thread dump to analyze the app performance

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to capture thread dump for, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to capture thread dump for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to capture thread dump from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to capture thread dump from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to capture thread dump for, Either app id or name is required, use 'listApps' tool to list available applications
      - AppName (string, optional): The name of the app to capture thread dump for, Either app id or name is required, use 'listApps' tool to list available applications
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
          description: Optional, name of the application. Either app id or app name is required. use 'listApps' tool to list available applications
      required:
        - baseInput
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: bw_delete_app
    description: |-

      Name / Purpose:

      delete (undeploy) a BW application (deployment) from a dataplane

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to delete the app from, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to delete the app for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to delete the app from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to delete the app from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to delete, Either app id or name is required, use 'listApps' tool to list available applications
      - AppName (string, optional): The name of the app to delete, Either app id or name is required, use 'listApps' tool to list available applications
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
          description: Optional, name of the application. Either app id or app name is required. use 'listApps' tool to list available applications
      required:
        - baseInput
      additionalProperties: false
  - name: bw_delete_app_build
    description: |-

      Name / Purpose:

      delete one or more BW application builds (deployment artifacts) from a dataplane in a single call

      Output / Returns:
      - A map keyed by buildId; each value is either the delete response or an error string if that build failed

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to delete the app build from, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to delete the app build for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to delete the app build from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to delete the app build from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - BuildIds ([]string, required): List of build IDs to delete. Use 'bw_list_app_builds' tool to list available builds

      Limitations / Notes / Best Practices / Error Handling / Performance Considerations:
      - App builds associated with deployed applications cannot be deleted. Please delete the application first before deleting the app build.
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        buildIds:
          type:
            - "null"
            - array
          items:
            type: string
          description: Required, list of build IDs to delete in a single call. Use 'bw_list_app_builds' tool to list available builds
      required:
        - baseInput
        - buildIds
      additionalProperties: false
  - name: bw_deploy_helm_managed_app
    description: |-

      Name / Purpose:

      deploy (create a deployment of) a helm managed BW app on a dataplane for the provided build id
      Output / Returns:
      - appId on success or failure message

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to deploy the app on, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to deploy the app for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to deploy the app on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to deploy the app on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - BuildId (string, required): The ID of the app build to deploy, use 'bw_list_app_builds' tool to list available builds
      - Namespace (string, optional): The namespace to deploy the app on, if not provided, default namespace will be used
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        buildId:
          type: string
          description: Required, Build Id of the application to deploy, use 'bw_list_app_builds' tool to list available builds
        namespace:
          type: string
          description: Optional, namespace to deploy the application in, use 'bw_list_namespaces' tool to list available namespaces
      required:
        - baseInput
        - buildId
      additionalProperties: false
  - name: bw_download_smart_engine_report
    description: |-

      Name / Purpose:

      download a smart engine report for a given BW6 Container app

      Output / Returns:
      - the report HTML file to analyze the app performance

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to download report for, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to download report for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to download report from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to download report from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to download report for, Either app id or name is required, use 'listApps' tool to list available applications
      - AppName (string, optional): The name of the app to download report for, Either app id or name is required, use 'listApps' tool to list available applications
      - ReportId (string, required): The ID of the report to download, use 'bw_list_smart_engine_reports' tool to list available reports for the application
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
          description: Optional, name of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        reportId:
          type: string
          description: Required, id of the report to download, use 'bw_list_smart_engine_reports' tool to list available reports for the application
      required:
        - baseInput
        - reportId
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: bw_enable_smart_engine_for_bw_app
    description: |-

      Name / Purpose:

      Enable smart engine for a given BW app

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to enable smart engine for, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to enable smart engine for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to enable smart engine on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to enable smart engine on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to enable smart engine for, Either app id or name is required, use 'listApps' tool to list available applications
      - AppName (string, optional): The name of the app to enable smart engine for, Either app id or name is required, use 'listApps' tool to list available applications
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
          description: Optional, name of the application. Either app id or app name is required. use 'listApps' tool to list available applications
      required:
        - baseInput
      additionalProperties: false
  - name: bw_generate_smart_engine_report
    description: |-

      Name / Purpose:

      generate smart engine report for a given BW app

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to generate report for, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to generate report for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to generate report on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to generate report on, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppId (string, optional): The ID of the app to generate report for, Either app id or name is required, use 'listApps' tool to list available applications
      - AppName (string, optional): The name of the app to generate report for, Either app id or name is required, use 'listApps' tool to list available applications
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appId:
          type: string
          description: Optional, id of the application. Either app id or app name is required. use 'listApps' tool to list available applications
        appName:
          type: string
          description: Optional, name of the application. Either app id or app name is required. use 'listApps' tool to list available applications
      required:
        - baseInput
      additionalProperties: false
  - name: bw_get_all_capability_summary
    description: |-

      Name / Purpose:

      Get all information about a BW5 or BW6 Container capability such as capability chart versions, ingress or gateway details, all provisioned connectors, BW versions and supplements, all application public endpoints.

      Use this tool only when you need summary or readiness report of all BW5 or BW6 Containers capability information. Use dedicated tools for specific information.

      Output / Returns:
      - Capability Name
      - Capability Release Version
      - Capability Chart Version
      - Capability Ingress or gateway Details
      - Public API endpoint
      - Execution History enabled status
      - List of All provisioned connectors & BW versions
      - List of All uploaded supplements
      - List of all application public endpoints

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to fetch information from, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to fetch information for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to fetch information from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to fetch information from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
      required:
        - baseInput
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: bw_get_app_details
    description: |-

      Name / Purpose:

      get application (deployment) details for a list of BW applications (deployments) in a single call

      Output / Returns:
      - A map keyed by App ID; each value is either the app details object or an error string if that app failed
      - App ID
      - App Name
      - App Version
      - App Description
      - BW Version & base image tag
      - System or engine properties: includes OTel status: look for name=='BW_OTEL_TRACES_ENABLED' (value=='true' means OpenTelemetry tracing is enabled) and name=='BW_OTEL_METRICS_ENABLED' (value=='true' means OpenTelemetry metrics are enabled) in systemProperties
      - Resource Limits
      - Autoscaling config
      - Volume, volume mounts

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to fetch app details from, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to fetch app details for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to fetch app details from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to fetch app details from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppIds ([]string, optional): The IDs of the apps to fetch details for, Either app ids or app names are required, use 'listApps' tool to list available applications from dataplane
      - AppNames ([]string, optional): The names of the apps to fetch details for, Either app ids or app names are required, use 'listApps' tool to list available applications from dataplane

      Limitations / Notes / Best Practices / Error Handling / Performance Considerations:
      - Partial failures are supported for per-app fetch/parse errors; invalid AppIds/AppNames currently fail validation and abort the request
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appIds:
          type:
            - "null"
            - array
          items:
            type: string
          description: Optional, ids of the applications. Either app ids or app names are required. use 'listApps' tool to list available applications
        appNames:
          type:
            - "null"
            - array
          items:
            type: string
          description: Optional, names of the applications. Either app ids or app names are required. use 'listApps' tool to list available applications
      required:
        - baseInput
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: bw_get_app_endpoints
    description: |-

      Name / Purpose:

      get all the app endpoints for given list of BW applications (deployments)

      Output / Returns:
      - service name
      - service port
      - endpoint visibility (public/private)
      - public endpoint URL
      - private endpoint URL

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to fetch app endpoints from, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to fetch app endpoints for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to fetch app endpoints from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to fetch app endpoints from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - AppIds ([]string, optional): The IDs of the apps to fetch endpoints for, Either app ids or names are required, use 'listApps' tool to list available applications from dataplane
      - AppNames ([]string, optional): The names of the apps to fetch endpoints for, Either list of app ids or names are required, use 'listApps' tool to list available applications from dataplane
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        appIds:
          type:
            - "null"
            - array
          items:
            type: string
          description: Optional, ids of the applications. Either app ids or app names are required. use 'listApps' tool to list available applications
        appNames:
          type:
            - "null"
            - array
          items:
            type: string
          description: Optional, names of the applications. Either app ids or app names are required. use 'listApps' tool to list available applications
      required:
        - baseInput
      additionalProperties: false
    annotations:
      readOnlyHint: true
  - name: bw_get_apps_for_build
    description: |-

      Name / Purpose:

      get all the BW apps (deployments) for one or more build IDs in a single call

      Output / Returns:
      - A map keyed by buildId; each value is either the apps list or an error string if that build failed
      - App ID
      - App Name
      - App Status

      Arguments / Parameters:
      - CapabilityInstanceId (string, optional): The ID of the capability instance to fetch apps from, Either capability Id or capability Instance Id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
      - CapabilityId (string, optional): The ID of the capability to fetch apps for, Either capability Id or capability Instance Id is required, Supported values: 'BWCE', 'BW5CE'. Use 'listCapabilityInstances' tool to list available capabilities from dataplane
      - DataPlaneId (string, optional): The ID of the data plane to fetch apps from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - DataplaneName (string, optional): The name of the data plane to fetch apps from, Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
      - BuildIds ([]string, required): List of build IDs to fetch apps for in a single call. Use 'bw_list_app_builds' tool to list available builds
    inputSchema:
      type: object
      properties:
        baseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, data plane id. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            capabilityId:
              type: string
              description: 'Optional, capability id. Either capability id or capability instance id is required, Supported values: BWCE, BW5CE. Use ''listCapabilityInstances'' tool to list available capabilities from dataplane'
            capabilityInstanceId:
              type: string
              description: Optional, capability instance id. Either capability id or capability instance id is required, use 'listCapabilityInstances' tool to list capability instances from dataplane
          additionalProperties: false
        buildIds:
          type:
            - "null"
            - array
