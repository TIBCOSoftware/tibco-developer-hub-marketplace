      idempotentHint: true
      openWorldHint: true
  - name: chart_violations
    description: |-
      Generate visualization for threshold violation detection results.

      Creates charts from detect_violations tool output showing which applications
      violated thresholds and when. Supports multiple visualization types for
      different analysis needs.

      Chart Types:
          - bar (default): Compare violation severity across applications
            Shows violation percentage with color coding (green/orange/red)
            Best for: Quick overview of which apps have most violations

          - heatmap: Show violation patterns over time
            X-axis: Time, Y-axis: Apps, Color: Violation intensity
            Best for: Identifying time-based patterns and trends

          - timeline: Show when violations occurred
            Horizontal bars showing first to last violation
            Best for: Understanding violation duration and timing

      Args:
          violation_data: JSON string from detect_violations tool output
          chart_type: Type of chart - "bar", "heatmap", or "timeline" (default: "bar")
          title: Chart title (default: "Threshold Violations")
          width: Chart width in pixels (default: 1200)
          height: Chart height in pixels (default: 600)
          output_format: "png", "html", or "png+html" (default: "png+html")

      Returns:
          JSON string containing:
          - png_data: Base64-encoded PNG image (if PNG output requested)
          - html_data: Base64-encoded HTML chart (if HTML output requested)
          - chart_type: Type of chart generated
          - summary: Summary from violation data

      Color Coding (bar chart):
          - Green: < 10% violation rate (low severity)
          - Orange: 10-30% violation rate (medium severity)
          - Red: > 30% violation rate (high severity)

      Examples:
          User: "Detect CPU violations above 80% and show me a chart"
          Claude calls:
          1. detect_violations(violation_type="cpu", threshold=0.8)
          2. generate_violation_chart(violation_data=<result>, chart_type="bar")

          User: "Show me a heatmap of memory violations over time"
          Claude calls:
          1. detect_violations(violation_type="memory")
          2. generate_violation_chart(violation_data=<result>, chart_type="heatmap")

          User: "When did the violations occur? Show timeline"
          Claude calls:
          1. detect_violations(...)
          2. generate_violation_chart(violation_data=<result>, chart_type="timeline")

      Input Format (from detect_violations):
          {
              "summary": {
                  "violation_type": "cpu",
                  "threshold": 0.8,
                  "total_apps_analyzed": 5,
                  "apps_with_violations": 3
              },
              "violations": [
                  {
                      "app_name": "inventory-mgmt",
                      "max_value": 0.95,
                      "violation_count": 48,
                      "violation_percentage": 28.6,
                      "first_violation": "2025-02-16T08:15:00Z",
                      "last_violation": "2025-02-23T14:30:00Z",
                      "time_series": [...]
                  }
              ]
          }

      Output Format:
          {
              "status": "success",
              "chart_type": "bar",
              "png_data": "iVBORw0KGgoAAAANS...",  # Base64 PNG
              "html_data": "PCFET0NUWVBFIGh0...",  # Base64 HTML
              "png_size_bytes": 45678,
              "html_size_bytes": 12345,
              "summary": {
                  "apps_with_violations": 3,
                  "violation_type": "cpu"
              }
          }

      Note: Charts are returned as base64-encoded data, no files saved.
    inputSchema:
      additionalProperties: false
      properties:
        violation_data:
          type: string
        chart_type:
          default: bar
          type: string
        title:
          default: Threshold Violations
          type: string
        width:
          default: 1200
          type: integer
        height:
          default: 600
          type: integer
        output_format:
          default: png+html
          type: string
      required:
        - violation_data
      type: object
    annotations:
      title: Chart Violations
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: dashboard_create
    description: "Create a new platform observability dashboard\n\nCreates a new dashboard with or without default cards for monitoring platform observability metrics.\nThe dashboard includes predefined cards for CPU utilization, memory usage, request counts,\nand error rates based on the specified applications and data plane.\n\nFeatures:\n- Auto-generated dashboard names if not specified\n- Default monitoring cards for common metrics\n- Application and data plane filtering\n- Configurable time ranges for all cards\n- Support for multiple capability types\n- Support for blank dashboard without default cards\n- Dry-run mode for safe testing (set dry_run=true to validate without creating)\n\nExample Request:\n{\n    \"name\": \"Production BWCE Dashboard\",\n    \"capability\": \"bwce\",\n    \"data_plane_id\": \"dp-prod-01\",\n    \"app_ids\": [\"app-123\", \"app-456\"],\n    \"time_slot\": \"48h\",\n    \"dry_run\": false\n}\n\nExample Response (Success):\n{\n    \"dashboard_name\": \"Production BWCE Dashboard\",\n    \"dashboard_id\": \"dash-789\",\n    \"link\": \"https://platform.tibco.com/dashboards/dash-789\",\n    \"created_at\": \"2025-12-15T12:00:00Z\"\n}\n\nArgs:\n    request: Dashboard creation request parameters\n        - name (str, optional): Dashboard name (auto-generated if empty)\n        - capability (str, optional): Capability type (default: \"bwce\")\n        - data_plane_id (str, optional): Data plane ID (global if empty)\n        - app_ids (list, optional): Application IDs to monitor\n        - time_slot (str, optional): Time range (default: \"48h\")\n        - dry_run (bool, optional): Validate without creating (default: false)\n    \nReturns:\n    JSON string with dashboard creation result or error information.\n    In dry-run mode, returns the payload that would be sent without creating the dashboard."
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Request schema for creating a new dashboard
          properties:
            name:
              anyOf:
                - type: string
                - type: "null"
              default: ""
              description: Dashboard name. If empty, auto-generated name will be used
            capability:
              anyOf:
                - type: string
                - type: "null"
              default: bwce
              description: Capability type for the dashboard (e.g., 'bwce')
            data_plane_id:
              anyOf:
                - type: string
                - type: "null"
              default: ""
              description: Data plane ID. If empty, global data plane will be used
            app_ids:
              description: List of application IDs to include in dashboard cards
              items:
                type: string
              type: array
            time_slot:
              anyOf:
                - type: string
                - type: "null"
              default: 48h
              description: Default time slot for dashboard cards (e.g., '24h', '48h', '7d')
            dry_run:
              anyOf:
                - type: boolean
                - type: "null"
              default: false
              description: If true, validates the request without creating the dashboard. Returns what would be created.
          type: object
      required:
        - request
      type: object
    annotations:
      title: Create Dashboard
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: true
  - name: dashboard_get
    description: "Get an existing platform observability dashboard by name\n\nRetrieves the complete configuration of an existing dashboard including all cards,\nlayout information, and metadata. Use this to inspect dashboard structure or\nverify dashboard creation.\n\nExample Request:\n{\n    \"dashboard_name\": \"Production BWCE Dashboard\"\n}\n\nExample Response (Success):\n{\n    \"dashboard_name\": \"Production BWCE Dashboard\",\n    \"dashboard_id\": \"dash-789\",\n    \"capability\": \"bwce\",\n    \"cards\": [\n        {\n            \"card_id\": \"card-001\",\n            \"title\": \"CPU Utilization\",\n            \"metrics\": \"k8s_container_cpu_request_utilization_ratio\",\n            \"chart_type\": \"line\"\n        }\n    ],\n    \"link\": \"https://platform.tibco.com/dashboards/dash-789\"\n}\n\nArgs:\n    request: Dashboard retrieval request with dashboard name\n        - dashboard_name (str, required): Name of the dashboard to retrieve\n    \nReturns:\n    JSON string with dashboard configuration or error information"
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Request schema for retrieving a dashboard
          properties:
            dashboard_name:
              description: Name of the dashboard to retrieve
              type: string
          required:
            - dashboard_name
          type: object
      required:
        - request
      type: object
    annotations:
      title: Get Dashboard
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: dashboard_add_card
    description: "Add a new card to an existing platform observability dashboard\n\nAdds a new card to an existing dashboard to monitor specific metrics with\noptions of filter by list of application id (app_id) and application name (app_name) and\noptions of visualization settings. The card will be positioned automatically based on\nexisting cards in the dashboard.\n\nFeatures:\n- Custom metrics and aggregation settings\n- Application and data plane filtering\n- Configurable chart types and time ranges\n- Automatic card positioning and sizing\n- Support for various aggregation operators\n- Support for metrics card and logs card\n- Dry-run mode for safe testing (set dry_run=true to validate without adding)\n\nExample Request:\n{\n    \"dashboard_name\": \"Production BWCE Dashboard\",\n    \"title\": \"Memory Usage\",\n    \"metrics_name\": \"k8s_container_memory_working_set_bytes\",\n    \"capability\": \"bwce\",\n    \"app_ids\": [\"app-123\"],\n    \"time_slot\": \"24h\",\n    \"aggregation_type\": \"avg\",\n    \"aggregation_operator\": \"avg\",\n    \"chart_type\": \"line\",\n    \"dry_run\": false\n}\n\nExample Response (Success):\n{\n    \"card_id\": \"card-456\",\n    \"dashboard_name\": \"Production BWCE Dashboard\",\n    \"title\": \"Memory Usage\",\n    \"link\": \"https://platform.tibco.com/dashboards/dash-789\"\n}\n\nArgs:\n    request: Card creation request parameters\n        - dashboard_name (str, required): Dashboard to add card to\n        - title (str, required): Card title\n        - metrics_name (str, required): Metric name (from get_metrics_listings)\n        - capability (str, optional): Capability type (default: \"bwce\")\n        - app_ids (list, optional): Application IDs to filter\n        - time_slot (str, optional): Time range (default: \"48h\")\n        - aggregation_type (str, optional): Aggregation (default: \"increase\")\n        - chart_type (str, optional): Chart type (default: \"line\")\n        - dry_run (bool, optional): Validate without adding (default: false)\n    \nReturns:\n    JSON string with card creation result or error information.\n    In dry-run mode, returns the payload that would be sent without adding the card."
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Request schema for adding a card to an existing dashboard
          properties:
            dashboard_name:
              description: Name of the dashboard to add the card to
              type: string
            title:
              description: Title for the card
              type: string
            metrics_name:
              description: Name of the metrics (e.g., 'k8s_container_cpu_request_utilization_ratio') that can be obtained from either get_available_metrics or metrics_config API
              type: string
            capability:
              anyOf:
                - type: string
                - type: "null"
              default: bwce
              description: Capability type for the card
            data_plane_id:
              anyOf:
                - type: string
                - type: "null"
              default: ""
              description: Data plane ID. If empty, global data plane will be used
            app_ids:
              description: List of application IDs to filter the card data
              items:
                type: string
              type: array
            app_names:
              description: List of application names to filter the card data
              items:
                type: string
              type: array
            time_slot:
              anyOf:
                - type: string
                - type: "null"
              default: 48h
              description: Time slot for the card data (e.g., '24h', '48h', '7d')
            aggregation_type:
              anyOf:
                - type: string
                - type: "null"
              default: increase
              description: Aggregation type (e.g., 'rate', 'increase', 'avg')
            aggregation_operator:
              anyOf:
                - type: string
                - type: "null"
              default: sum
              description: Aggregation operator (e.g., 'avg', 'sum', 'max', 'min')
            chart_type:
              anyOf:
                - type: string
                - type: "null"
              default: line
              description: Chart type for visualization (e.g., 'line', 'bar', 'area')
            category:
              anyOf:
                - type: string
                - type: "null"
              default: metrics
              description: Category of the card (e.g. 'metrics', 'logs')
            dry_run:
              anyOf:
                - type: boolean
                - type: "null"
              default: false
              description: If true, validates the request without adding the card. Returns what would be created.
          required:
            - dashboard_name
            - title
            - metrics_name
          type: object
      required:
        - request
      type: object
    annotations:
      title: Add Card to Dashboard
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: true
  - name: metrics_list_all
    description: |-
      Get complete list of ALL available metrics across ALL capabilities

      Retrieves the full catalog of available metrics from all capability types
      (bwce, flogo, bw5ce). Use this when you need to browse or search
      across all metrics, or when the capability type is unknown.

      Each metric includes: metric_name, display_name, description, capability,
      type, unit, and category.

      Use this tool when:
      - You need to see all available metrics
      - You want to search across all capabilities
      - The capability type is not yet determined

      For filtered results by a specific capability, use get_metrics_listings_by_capability instead.

      Example Response (Success):
      {
          "metrics": [
              {
                  "metricName": "k8s_container_cpu_request_utilization_ratio",
                  "displayName": "CPU Utilization Ratio",
                  "description": "Container CPU request utilization ratio",
                  "capability": "bwce",
                  "metricType": "gauge",
                  "unit": "ratio",
                  "category": "performance"
              },
              {
                  "metricName": "k8s_container_memory_working_set_bytes",
                  "displayName": "Memory Working Set",
                  "capability": "flogo",
                  "metricType": "gauge",
                  "unit": "bytes"
              }
          ]
      }

      Args:
          ctx (Context, optional): The request context containing authentication and other metadata.

      Returns:
          str: A JSON-formatted string containing the complete metrics catalog or error information.

      Raises:
          Exception: If an error occurs while retrieving the metrics labels.
    inputSchema:
      additionalProperties: false
      properties: {}
      type: object
    annotations:
      title: Get Metrics Listings
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: dashboard_delete
    description: "Delete a platform observability dashboard\n\nPermanently removes a dashboard and all its cards from the system.\nThis is a destructive operation that cannot be undone. Use with caution.\n\nFeatures:\n- Permanent deletion of dashboard and all associated cards\n- Idempotent operation (safe to retry if dashboard already deleted)\n- Validates dashboard existence before deletion\n- Returns confirmation message on success\n\nExample Request:\n{\n    \"dashboard_name\": \"Production BWCE Dashboard\"\n}\n\nExample Response (Success):\n{\n    \"message\": \"dashboard deleted\",\n    \"dashboard_name\": \"Production BWCE Dashboard\",\n    \"deleted_at\": \"2025-12-15T12:30:00Z\"\n}\n\nExample Response (Not Found):\n{\n    \"isError\": true,\n    \"error\": {\n        \"message\": \"Failed to delete dashboard\",\n        \"details\": \"dashboard 'Production BWCE Dashboard' not found\"\n    }\n}\n\nArgs:\n    request: Dashboard deletion request parameters\n        - dashboard_name (str, required): Name of the dashboard to delete\n        \nReturns:\n    JSON string with deletion result or error information\n    \nWarning:\n    This operation is DESTRUCTIVE and IRREVERSIBLE. All dashboard \n    configuration and cards will be permanently removed."
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Request schema for deleting a dashboard
          properties:
            dashboard_name:
              description: Name of the dashboard to delete
              type: string
          required:
            - dashboard_name
          type: object
      required:
        - request
      type: object
    annotations:
      title: Delete Dashboard
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
  - name: metrics_list_by_capability
    description: |-
      Get metrics filtered by a SPECIFIC capability type for targeted dashboard creation

      Retrieves ONLY the metrics available for a specific capability type. This is the
      preferred tool when you know which capability you're working with, as it returns
      a focused, relevant subset of metrics.

      Capability types: "bwce", "flogo", "bw5ce"

      Use this tool when:
      - You know the specific capability type (e.g., creating a BWCE dashboard)
      - You want a focused list of metrics for one capability
      - You're adding cards to an existing dashboard with a known capability

      For the complete metrics catalog across all capabilities, use get_metrics_listings instead.

      Example Request:
      capability = "bwce"

      Example Response (Success):
      {
          "capability": "bwce",
          "metrics": [
              {
                  "metricName": "k8s_container_cpu_request_utilization_ratio",
                  "displayName": "CPU Utilization Ratio",
                  "description": "Container CPU request utilization ratio",
                  "metricType": "gauge",
                  "unit": "ratio",
                  "category": "performance"
              },
              {
                  "metricName": "bwce_activity_execution_count",
                  "displayName": "Activity Execution Count",
                  "metricType": "counter",
                  "unit": "count"
              }
          ]
      }

      Args:
          capability (str): Capability type to filter metrics (default: "bwce").
              Valid options: "bwce", "flogo", "bw5ce"
          ctx (Context, optional): Context object containing authentication and request information.

      Returns:
          str: JSON string with capability-specific metrics or error information.

      Raises:
          Exception: If there is an error retrieving the metrics.
    inputSchema:
      additionalProperties: false
      properties:
        capability:
          default: bwce
          type: string
      type: object
    annotations:
      title: Get Metrics Listings by Capability
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
