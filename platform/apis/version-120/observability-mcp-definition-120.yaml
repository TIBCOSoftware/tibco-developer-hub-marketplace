serverInfo:
  name: Platform Observability MCP Server
  version: 1.20.0
capabilities:
  experimental: {}
  logging: {}
  prompts:
    listChanged: true
  resources:
    subscribe: false
    listChanged: true
  tools:
    listChanged: true
  extensions:
    io.modelcontextprotocol/ui: {}
tools:
  - name: analyze_application
    description: |-
      Get app health status and metrics in one call

      Returns CPU, memory, errors, and execution-time metrics plus an overall health score.
      Useful for quick health checks or detailed performance analysis. The execution_time
      metric evaluation is used as a measure of performance, based on the time it takes for
      the BW process to complete and respond.

      Request Parameters:
          - app_id (str, optional): Application identifier (app ID or app name). Automatically resolved via the platform lookup API.
          - app_type (str, optional): Application type - bwce, flogo, bw5ce, bw5. Default: bwce
          - data_plane (str, optional): Data plane identifier (ID or name). Automatically resolved via the platform lookup API. If omitted, queries all permitted data planes.
          - metrics (list, optional): Which metrics to get. Options: cpu, memory, requests, errors, execution_time. Default: all metrics
          - time_range (str, optional): Time range - 1h, 6h, 1d, 7d, 30d. Default: 1h
          - include_health_score (bool, optional): Calculate health score 0-100. Default: true
          - include_recommendations (bool, optional): Generate recommendations. Default: true

      Example Request (all metrics):
          {
              "app_id": "my-bwce-app",
              "app_type": "bwce",
              "data_plane": "d5eo67m2n86c73d56uc0",
              "time_range": "1h"
          }

      Example Request (specific metrics):
          {
              "app_id": "app-123",
              "app_type": "flogo",
              "data_plane": "d5eo67m2n86c73d56uc0",
              "metrics": ["cpu", "memory", "errors"],
              "time_range": "6h"
          }

      Example Response:
          {
              "status": "success",
              "app_id": "app-123",
              "app_name": "my-bwce-app",
              "health": {
                  "status": "healthy",
                  "score": 95,
                  "issues": []
              },
              "metrics": {
                  "cpu": {
                      "current": 0.45,
                      "avg": 0.42,
                      "max": 0.78,
                      "unit": "ratio"
                  },
                  "memory": {
                      "current": 0.039116,
                      "avg": 0.035678,
                      "max": 0.078234,
                      "unit": "ratio"
                  },
                  "errors": {
                      "total": 45,
                      "rate": 0.02,
                      "percent": 2.1
                  }
              },
              "recommendations": [
                  "CPU utilization is healthy",
                  "Memory usage is normal"
              ]
          }

      Returns:
          JSON string with health status, metrics data, and recommendations
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Analyze application request
          properties:
            app_id:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Application identifier (app ID or app name). Automatically resolved to app ID via the platform lookup API.
            app_type:
              default: bwce
              description: 'App type: bwce, flogo, bw5ce, bw5'
              type: string
            data_plane:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Data plane identifier (data plane ID or name). Automatically resolved to data plane ID via the platform lookup API. If omitted, queries across all permitted data planes.
            metrics:
              anyOf:
                - items:
                    enum:
                      - cpu
                      - memory
                      - requests
                      - errors
                      - execution_time
                    type: string
                  type: array
                - type: "null"
              default: null
              description: 'Which metrics to get. Default: all. ''execution_time'' measures how long a BW process takes to complete and respond, and is used as the indicator of the application''s performance.'
            time_range:
              default: 1h
              description: 'Time range: 1h, 6h, 1d, 7d, 30d'
              type: string
            include_health_score:
              default: true
              description: Calculate health score
              type: boolean
            include_recommendations:
              default: true
              description: Generate recommendations
              type: boolean
            start_time:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Start time (ISO 8601)
            end_time:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: End time (ISO 8601)
            step:
              default: 1m
              description: Query step
              type: string
          type: object
      required:
        - request
      type: object
    annotations:
      title: Analyze Application
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: detect_violations
    description: |-
      Find apps exceeding thresholds for CPU, memory, execution time, or request rates

      Detects violations across different metric types using configurable thresholds and time windows.
      Good for SLA monitoring, capacity planning, and finding problem apps.

      Violation Types:
          - cpu: Detect CPU utilization above threshold (e.g., > 80%)
          - memory: Detect memory utilization above threshold (e.g., > 80%)
          - execution_time: Detect execution time degradation vs baseline (e.g., 20% slower)
          - request_rate: Detect when success rate drops or failure rate rises (e.g., < 99% success)

      Request Parameters:
          - violation_type (str, required): cpu, memory, execution_time, or request_rate
          - threshold (float, optional): Threshold value. Defaults: cpu/memory=0.8, execution_time=1.2, request_rate=0.9
          - time_window (str, optional): Look-back window - 1h, 6h, 1d, 7d, 30d. Default: 1d
          - sample_interval (str, optional): Sampling interval - 1m, 5m, 15m, 1h. Default: 5m
          - capability (str, optional): bwce, flogo, or bw5ce. Default: bwce
          - app_id (str, optional): Application identifier(s) to filter (comma-separated app IDs or app names). Automatically resolved via the platform lookup API.
          - data_plane (str, optional): Data plane identifier (ID or name). Automatically resolved via the platform lookup API. If omitted, queries all permitted data planes.

      Type-Specific Parameters:
          For cpu/memory:
              - ratio_type: request or limit. Default: request

          For execution_time:
              - baseline_window: Baseline comparison window. Default: 24h
              - comparison_window: Current period window. Default: 5m

          For request_rate:
              - rate_type: success or failure. Default: success
              - min_request_count: Minimum requests to consider. Default: 1

      Example (CPU violations):
          {
              "violation_type": "cpu",
              "threshold": 0.8,
              "time_window": "7d",
              "sample_interval": "5m",
              "capability": "bwce",
              "ratio_type": "request"
          }

      Example (Request rate violations):
          {
              "violation_type": "request_rate",
              "threshold": 0.99,
              "rate_type": "success",
              "time_window": "1d",
              "capability": "bwce",
              "app_ids": "app-123,app-456"
          }

      Example Response (CPU/Memory — instant query, Prometheus filters by threshold):
          {
              "summary": {
                  "threshold": 0.8,
                  "time_window": "7d",
                  "sample_interval": "5m",
                  "total_apps_analyzed": 12,
                  "apps_with_violations": 3
              },
              "violations": [
                  {
                      "app_id": "app-123",
                      "app_name": "production-service",
                      "dataplane_id": "dp-prod-01",
                      "max_cpu_ratio": 0.95,
                      "exceeded_by": 0.15
                  }
              ]
          }

      Returns:
          JSON string with summary and per-app violation details.
          When violations are found, an `_agent_hint` field is included to guide
          follow-up queries — use a narrower time window around the violation
          period instead of re-querying the full original window.
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Detect violations request
          properties:
            violation_type:
              description: Violation type
              enum:
                - cpu
                - memory
                - execution_time
                - request_rate
              type: string
            threshold:
              anyOf:
                - type: number
                - type: "null"
              default: null
              description: 'Threshold (default: cpu/mem=0.8, exec_time=1.2, req_rate=0.9)'
            time_window:
              default: 1d
              description: 'Time window: 1h, 6h, 1d, 7d, 30d'
              type: string
            sample_interval:
              default: 5m
              description: 'Sample interval: 1m, 5m, 15m, 1h'
              type: string
            capability:
              default: bwce
              description: 'Capability: bwce, flogo, bw5ce, bw5'
              type: string
            app_id:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Application identifier(s) to filter (comma-separated app IDs or app names). Automatically resolved to app IDs via the platform lookup API.
            data_plane:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Data plane identifier (data plane ID or name). Automatically resolved to data plane ID via the platform lookup API. If omitted, queries across all permitted data planes.
            ratio_type:
              anyOf:
                - enum:
                    - request
                    - limit
                  type: string
                - type: "null"
              default: request
              description: CPU/memory ratio type
            baseline_window:
              anyOf:
                - type: string
                - type: "null"
              default: 24h
              description: 'Exec time: baseline window'
            comparison_window:
              anyOf:
                - type: string
                - type: "null"
              default: 5m
              description: 'Exec time: comparison window'
            rate_type:
              anyOf:
                - enum:
                    - success
                    - failure
                  type: string
                - type: "null"
              default: success
              description: 'Request rate: success or failure'
            min_request_count:
              anyOf:
                - type: integer
                - type: "null"
              default: 1
              description: 'Request rate: min requests'
            process_name:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Filter by process/flow name(s). For BWCE/BW5CE maps to 'process_name' label; for Flogo maps to 'flow_name' label. Ignored for other capabilities. Accepts a single name or a comma-separated list (e.g. 'processA,processB'). Uses regex matching for multiple values.
            metric_name:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Override metric name
          required:
            - violation_type
          type: object
      required:
        - request
      type: object
    annotations:
      title: Detect Threshold Violations
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: query_metrics
    description: |-
      Query metrics with custom aggregations and time ranges

      Flexible metric queries with full control. Supports metric shortcuts, raw PromQL names,
      or custom PromQL expressions with validate-then-execute guardrail.

      TWO MODES:

      Mode 1 — Metric Shortcuts / Raw Names (set 'metric'):
          Builds PromQL from a metric shortcut or raw metric name with label filters.

      Mode 2 — Custom PromQL (set 'custom_promql'):
          Passes your raw PromQL expression through the CP's PromQL validator for
          JWT-based authorization, then executes the SANITIZED query. Use this for
          complex PromQL that shortcuts cannot handle: nested subqueries, custom label
          matchers, binary operators (>, <, ==), multi-level aggregations.
          Requires 'data_plane'. When set, 'metric' and 'aggregate_function' are ignored.

      Query Types:
          - range: Returns time-series data over a time window
          - instant: Returns current point-in-time value

      Metric Shortcuts (Mode 1):
          - cpu_request_ratio → k8s_container_cpu_request_utilization_ratio
          - cpu_limit_ratio → k8s_container_cpu_limit_utilization_ratio
          - memory_request_ratio → k8s_container_memory_request_utilization_ratio
          - memory_limit_ratio → k8s_container_memory_limit_utilization_ratio
          - request_count → capability-specific request metric
          - execution_time → process_execution_time

      You can also use raw PromQL metric names.

      Aggregation Functions (Mode 1 only):
          - rate: Calculate rate of change
          - increase: Calculate increase over time
          - avg_over_time: Average over time window
          - max_over_time: Maximum over time window
          - min_over_time: Minimum over time window
          - sum_over_time: Sum over time window

      Request Parameters:
          - metric (str, optional): Metric shortcut or raw PromQL name. Required unless custom_promql is set.
          - custom_promql (str, optional): Raw PromQL expression. When set, requires data_plane.
          - query_type (str, required): range or instant
          - capability (str, optional): bwce, flogo, or bw5ce. Default: bwce
          - time_window (str, optional): Relative time - 1h, 6h, 1d, 7d, 30d. Default: 1h
          - start_time (str, optional): Absolute start time (ISO 8601). Overrides time_window
          - end_time (str, optional): Absolute end time (ISO 8601). Used with start_time
          - time (str, optional): Evaluation time for instant queries (ISO 8601). Default: now
          - aggregate_function (str, optional): PromQL aggregation function (Mode 1 only)
          - interval (str, optional): Aggregation interval - 5m, 15m, 1h. Default: 5m
          - app_id (str, optional): Application identifier(s) to filter (comma-separated app IDs or app names). Automatically resolved via the platform lookup API.
          - data_plane (str, optional): Data plane identifier (ID or name). Automatically resolved via the platform lookup API. If omitted, queries all permitted data planes. Required for custom_promql.

      Example (Range query with aggregation — Mode 1):
          {
              "metric": "cpu_request_ratio",
              "query_type": "range",
              "capability": "bwce",
              "time_window": "6h",
              "aggregate_function": "avg_over_time",
              "interval": "5m",
              "app_id": "app-123,app-456"
          }

      Example (Custom PromQL instant — Mode 2, find flogo apps with CPU > 80%):
          {
              "custom_promql": "max_over_time(max by (app_id, dataplane_id, app_type) (max_over_time(k8s_container_cpu_request_utilization_ratio{app_type=\"flogo\"}[5m]))[1d:5m]) > 0.8",
              "data_plane": "k8s-auto-dp1",
              "query_type": "instant"
          }

      Example (Custom PromQL range — Mode 2, CPU trend over 6 hours):
          {
              "custom_promql": "avg by (app_id) (k8s_container_cpu_request_utilization_ratio{app_type=\"flogo\"})",
              "data_plane": "k8s-auto-dp1",
              "query_type": "range",
              "time_window": "6h"
          }

      Example Response (Range — Mode 1):
          {
              "query": {
                  "metric": "cpu_request_ratio",
                  "promql": "avg_over_time(k8s_container_cpu_request_utilization_ratio{app_type="bwce"}[5m])",
                  "type": "range",
                  "start_time": "2026-02-23T02:00:00Z",
                  "end_time": "2026-02-23T08:00:00Z"
              },
              "summary": {
                  "total_series": 3,
                  "total_data_points": 216
              },
              "results": [...]
          }

      Returns:
          JSON string with time-series data or instant values, plus query metadata
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Query metrics request
          properties:
            metric:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: 'Metric (shortcut or raw name). Shortcuts: cpu_request_ratio, memory_limit_ratio, etc. Required unless custom_promql is provided.'
            custom_promql:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: 'Raw PromQL expression for advanced queries. When provided, the query is validated via the CP''s PromQL validator (JWT-based authorization), sanitized, and then executed. Use this for complex PromQL that metric shortcuts cannot handle: nested subqueries, custom label matchers, binary operators (>, <, ==), multi-level aggregations. When set, ''metric'' and ''aggregate_function'' are ignored.'
            query_type:
              default: range
              description: 'Type: range (time-series) or instant (current value)'
              enum:
                - range
                - instant
              type: string
            capability:
              default: bwce
              description: 'Capability: bwce, flogo, bw5ce, bw5'
              type: string
            time_window:
              anyOf:
                - type: string
                - type: "null"
              default: 1h
              description: 'Time window: 1h, 6h, 1d, 7d, 30d'
            start_time:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Start time (ISO 8601, overrides time_window)
            end_time:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: End time (ISO 8601)
            time:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: 'Instant query time (ISO 8601, default: now)'
            aggregate_function:
              anyOf:
                - enum:
                    - rate
                    - increase
                    - sum_over_time
                    - avg_over_time
                    - max_over_time
                    - min_over_time
                  type: string
                - type: "null"
              default: null
              description: PromQL aggregation
            interval:
              default: 5m
              description: Aggregation interval
              type: string
            step:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Query step interval (e.g. 5m, 15m, 1h). Auto-calculated if omitted.
            app_id:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Application identifier(s) to filter (comma-separated app IDs or app names). Automatically resolved to app IDs via the platform lookup API.
            data_plane:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Data plane identifier (data plane ID or name). Automatically resolved to data plane ID via the platform lookup API. If omitted, queries across all permitted data planes.
          type: object
      required:
        - request
      type: object
    annotations:
      title: Query Metrics
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: detect_performance_degradation
    description: |-
      Detect period-over-period performance degradation using PromQL offset

      Compares a metric's current period against a shifted baseline period to detect
      degradation that exceeds a configurable percent-increase threshold.

      Comparison Modes:
          - week_over_week: Compare last 7 days vs prior 7 days (default)
          - day_over_day: Compare last 1 day vs prior 1 day
          - hour_over_hour: Compare last 1 hour vs prior 1 hour
          - custom: Specify current_window, baseline_window, and offset

      Key Features:
          - Period-over-period comparison using PromQL offset modifier
          - Configurable percent-increase threshold (default: 0.2 = 20%)
          - Top-K offenders sorted by worst degradation
          - Per-application and per-process breakdown

      Request Parameters:
          - metric (str): Metric to analyze. Default: execution_time (resolved per capability)
          - capability (str): Capability type. Default: bwce
          - mode (str): Comparison mode. Default: week_over_week
          - threshold (float): Percent increase threshold. Default: 0.2 (20%)
          - current_window (str, optional): Override current window
          - baseline_window (str, optional): Override baseline window
          - offset (str, optional): Override offset duration
          - min_baseline_value (float): clamp_min floor. Default: 0.001
          - top_k (int): Max violations to return. Default: 20
          - app_id (str, optional): Application identifier(s) to filter (comma-separated app IDs or app names). Automatically resolved via the platform lookup API.
          - data_plane (str, optional): Data plane identifier (ID or name). Automatically resolved via the platform lookup API. If omitted, queries all permitted data planes.
          - process_name (str, optional): Filter by operation/process name

      Example (week-over-week):
          {
              "metric": "execution_time",
              "capability": "bwce",
              "mode": "week_over_week",
              "threshold": 0.2,
              "data_plane": "dp-prod-01"
          }

      Example (custom):
          {
              "metric": "execution_time",
              "capability": "bwce",
              "mode": "custom",
              "threshold": 0.15,
              "current_window": "12h",
              "baseline_window": "12h",
              "offset": "1d"
          }

      Returns:
          JSON with:
          - summary: {total_series_above_threshold, total_violations_found, violations_returned, top_k, worst_increase_ratio}
          - violations: [{labels, app_id, app_name, dataplane_id, app_type, process_name,
            max_increase_ratio (degradation ratio), exceeded_by (amount above threshold)}]
          - query: echo of resolved parameters and generated PromQL
          - _agent_hint: (when violations found) guidance for follow-up queries
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Schema for assessing period-over-period performance degradation using PromQL offset
          example:
            capability: bwce
            data_plane: dp-prod-01
            metric: execution_time
            mode: week_over_week
            threshold: 0.2
          properties:
            metric:
              default: execution_time
              description: Metric to analyze (shortcut like 'execution_time' or raw PromQL name). Resolved per capability via backend.
              type: string
            capability:
              default: bwce
              description: Capability type (bwce, flogo, bw5ce, bw5)
              type: string
            mode:
              default: week_over_week
              description: 'Comparison mode: ''week_over_week'' (7d vs prior 7d), ''day_over_day'' (1d vs prior 1d), ''hour_over_hour'' (1h vs prior 1h), or ''custom'' (requires current_window, baseline_window, offset)'
              type: string
            threshold:
              default: 0.2
              description: Percent increase threshold (0.2 = 20%). Only series exceeding this are returned.
              exclusiveMinimum: 0
              type: number
            current_window:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Current analysis window duration (e.g., '7d', '1d', '12h'). Required for 'custom' mode.
            baseline_window:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Baseline window duration (e.g., '7d', '1d', '12h'). Required for 'custom' mode.
            offset:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Offset duration for baseline shift (e.g., '7d', '1d'). Required for 'custom' mode.
            min_baseline_value:
              default: 0.001
              description: clamp_min floor for baseline to avoid divide-by-zero on tiny baselines
              exclusiveMinimum: 0
              type: number
            top_k:
              default: 20
              description: Return only top N offenders sorted by percent increase
              exclusiveMinimum: 0
              type: integer
            app_id:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Application identifier(s) to filter (comma-separated app IDs or app names). Automatically resolved to app IDs via the platform lookup API. If not specified, all apps are included.
            data_plane:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Data plane identifier (data plane ID or name). Automatically resolved to data plane ID via the platform lookup API. If omitted, queries across all permitted data planes.
            process_name:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Process/operation name to filter (e.g., 'create_order'). If not specified, all processes are included.
            include_sidecar_containers:
              default: false
              description: 'Include sidecar containers (e.g., fluent-bit) in results. Default: false (excludes fluent-bit).'
              type: boolean
          type: object
      required:
        - request
      type: object
    annotations:
      title: Detect Performance Degradation
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: record_app_violation_event
    description: |-
      Record an application violation event on the Control Plane.

      Use this tool when the agent reasons that an app has a violation worth
      recording: health score degradation, sustained high resource usage,
      recurring issues in the audit history, or a threshold breach surfaced
      by detect_violations / detect_performance_degradation.

      The violation event is:
      1. Persisted in the CP audit trail (Elasticsearch)
      2. Exported as a Prometheus metric (audit_event_count_total)

      analysis_event_id is OPTIONAL: pass it to correlate the violation to a
      prior analyze_application call; omit it when the violation is detected
      outside an analysis (e.g. straight from a detect_* tool).

      Request Parameters:
          - app_id (str, required): Application ID (resolved)
          - data_plane (str, required): Data plane ID (resolved)
          - violation_name (str, required): Violation event name, e.g. "HealthScoreDegraded"
          - analysis_event_id (str, optional): UUID from analyze_application response to correlate
          - severity (str, optional): "info", "warning", "critical". Default: "warning"
          - violation_details (str, optional): Free-form description of the violation
          - health_score (int, optional): Current health score for context
          - health_status (str, optional): Current health status
          - app_type (str, optional): App type. Default: "bwce"

      Example Request:
          {
              "app_id": "d6uolhoqpu4s73a5lru0",
              "data_plane": "d6uoflt5v8rc73e2f890",
              "violation_name": "HealthScoreDegraded",
              "analysis_event_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "severity": "warning",
              "violation_details": "Health score dropped from 92 to 65 over 3 analyses.",
              "health_score": 65,
              "health_status": "degraded"
          }
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Request to record an application violation event on the Control Plane.
          properties:
            app_id:
              description: Application ID (resolved). Use the app_id from analyze_application response.
              minLength: 1
              type: string
            data_plane:
              description: Data plane ID (resolved). Use a data plane ID from the analyze_application response (its data_planes list).
              minLength: 1
              type: string
            violation_name:
              description: Violation event name, e.g. 'HealthScoreDegraded', 'HighMemoryUsage', 'ConsecutiveDegradation'
              minLength: 1
              type: string
            analysis_event_id:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Optional UUID from a prior analyze_application response. When present, correlates this violation event to the analysis that triggered it. Omit when the violation is detected outside an analysis (e.g. directly from detect_violations).
            app_type:
              default: bwce
              description: 'App type: bwce, flogo, bw5ce, bw5'
              type: string
            severity:
              default: warning
              description: 'Severity: info, warning, critical'
              type: string
            violation_details:
              default: ""
              description: Free-form description of the violation from agent reasoning
              type: string
            health_score:
              anyOf:
                - type: integer
                - type: "null"
              default: null
              description: Current health score for context
            health_status:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Current health status for context
          required:
            - app_id
            - data_plane
            - violation_name
          type: object
      required:
        - request
      type: object
    annotations:
      title: Record App Violation Event
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: true
  - name: get_app_audit_history
    description: |-
      Retrieve audit history for an application.

      Returns recent audit events (analyses, violation events, config changes) for an app
      without running a full health analysis. Useful for checking what happened
      recently before deciding whether to investigate further.

      Request Parameters:
          - app_id (str, required): Application identifier (app ID or app name). Automatically resolved via the platform lookup API.
          - data_plane (str, optional): Data plane identifier (ID or name). Automatically resolved. If omitted, returns events across all data planes.
          - limit (int, optional): Maximum number of audit events to return (max: 50). Default: 10

      Example Request:
          {
              "app_id": "rest-bwce-1",
              "data_plane": "k8s-auto-dp1ns",
              "limit": 20
          }

      Example Response:
          {
              "status": "success",
              "available": true,
              "app_id": "d6uolhoqpu4s73a5lru0",
              "data_planes": ["d6uoflt5v8rc73e2f890"],
              "total_events": 3,
              "events": [
                  {
                      "timestamp": "2026-06-07T10:30:00Z",
                      "event": "App Health Analysis",
                      "status": "OK",
                      "source": "o11y-mcp-server",
                      "details": "Score: 95, Status: healthy, Issues: "
                  }
              ]
          }

      Audit history is best-effort context. If the audit backend is
      unavailable or returns an unparseable payload, the tool degrades
      gracefully rather than failing, returning:
          {
              "status": "unavailable",
              "available": false,
              "reason": "audit history temporarily unavailable",
              "app_id": "d6uolhoqpu4s73a5lru0",
              "data_planes": ["d6uoflt5v8rc73e2f890"],
              "total_events": 0,
              "events": []
          }
    inputSchema:
      additionalProperties: false
      properties:
        request:
          description: Request to retrieve audit history for an application.
          properties:
            app_id:
              description: Application identifier (app ID or app name). Automatically resolved to app ID via the platform lookup API.
              minLength: 1
              type: string
            data_plane:
              anyOf:
                - type: string
                - type: "null"
              default: null
              description: Data plane identifier (ID or name). Automatically resolved. If omitted, returns events across all data planes.
            limit:
              default: 10
              description: 'Maximum number of audit events to return (1-50). Default: 10'
              maximum: 50
              minimum: 1
              type: integer
          required:
            - app_id
          type: object
      required:
        - request
      type: object
    annotations:
      title: Get App Audit History
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: true
  - name: chart_single_metric
    description: |-
      Create interactive chart from metrics data (returned as base64 data, no files).

      IMPORTANT: Prefer chart_render for simple metric charts — it handles everything
      in one call. Use this tool only when you already have query metadata from a
      previous query_metrics call.

      Two modes of operation:
      1. **Direct fetch (recommended):** Provide promql, start_time, end_time from
         query_metrics response → query.promql, query.start_time, query.end_time.
         The chart tool fetches data from Prometheus directly — DO NOT relay the
         time_series JSON through the LLM.
      2. **Legacy mode:** Provide metrics_data as JSON string. AVOID this mode —
         it forces the LLM to relay large JSON, adding latency and risking corruption.

      Args:
          metrics_data: (Legacy, avoid) JSON string from query_metrics output.
          promql: (Recommended) PromQL query string from query_metrics response query.promql field.
              When provided with start_time/end_time, the chart tool fetches data directly
              from Prometheus — avoiding LLM data relay entirely.
          start_time: ISO 8601 start time (e.g., "2026-02-23T02:00:00Z"). Required with promql.
          end_time: ISO 8601 end time (e.g., "2026-02-23T08:00:00Z"). Required with promql.
          step: Step interval in seconds (e.g., "60"). If omitted, auto-calculated from time range.
          chart_type: Type of chart - "line", "bar", "scatter", "area" (default: "line")
          title: Chart title (default: "Metrics Chart")
          width: Chart width in pixels (default: 1200)
          height: Chart height in pixels (default: 600)
          output_format: "png", "html", or "png+html" (default: "png+html")

      Returns:
          JSON string containing:
          - png_data: Base64-encoded PNG image (if PNG output requested)
          - html_data: Base64-encoded HTML chart (if HTML output requested)
          - png_size_bytes: Size of PNG data
          - html_size_bytes: Size of HTML data
          - chart_type: Type of chart generated

      Examples:
          Direct fetch (recommended - pass query metadata from query_metrics response):
          - chart_single_metric(promql="avg_over_time(...)", start_time="...", end_time="...")
          One-call alternative (no prior query needed):
          - chart_render(metric="cpu_request_ratio", time_window="6h")

      Note: Charts are returned as base64-encoded data.
            No files are saved - data exists only in memory.
    inputSchema:
      additionalProperties: false
      properties:
        metrics_data:
          default: ""
          type: string
        promql:
          default: ""
          type: string
        start_time:
          default: ""
          type: string
        end_time:
          default: ""
          type: string
        step:
          default: ""
          type: string
        data_plane:
          default: ""
          type: string
        chart_type:
          default: line
          type: string
        title:
          default: Metrics Chart
          type: string
        width:
          default: 1200
          type: integer
        height:
          default: 600
          type: integer
        output_format:
          default: png+html
          type: string
      type: object
    annotations:
      title: Chart Single Metric
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: chart_render
    description: |-
      Render a chart for a metric in a single call — no data relay through the LLM.

      This tool queries Prometheus and generates a chart in one operation.
      The data flows entirely server-side: query Prometheus → generate chart → return result.
      The LLM never handles raw time-series data, eliminating corruption and latency issues.

      Args:
          metric: Metric shortcut or raw PromQL name.
              Shortcuts: cpu_request_ratio, cpu_limit_ratio, memory_request_ratio,
              memory_limit_ratio, request_count, execution_time
          query_type: "range" (time-series chart) or "instant" (current value bar chart). Default: "range"
          capability: bwce, flogo, or bw5ce. Default: "bwce"
          time_window: Relative time window - 1h, 6h, 1d, 7d, 30d. Default: "1h"
          start_time: (Optional) Absolute start time (ISO 8601). Overrides time_window.
          end_time: (Optional) Absolute end time (ISO 8601). Used with start_time.
          aggregate_function: PromQL aggregation - avg_over_time, max_over_time,
              min_over_time, sum_over_time, rate, increase. Default: "avg_over_time"
          interval: Aggregation interval - 5m, 15m, 1h. Default: "5m"
          app_id: (Optional) Application ID(s), comma-separated.
              If unknown, call listApps first to discover valid values.
          data_plane: Data plane ID or name. Strongly recommended.
              Auto-resolution may fail — if so, call listApps to get the
              data_plane value and pass it explicitly.
          chart_type: "line", "bar", "scatter", "area". Default: "line"
          title: Chart title. Auto-generated from metric name if omitted.
          width: Chart width in pixels. Default: 1200
          height: Chart height in pixels. Default: 600
          output_format: "png", "html", or "png+html". Default: "png+html"

      Returns:
          JSON string containing:
          - png_data: Base64-encoded PNG image (if PNG output requested)
          - html_data: Base64-encoded HTML chart (if HTML output requested)
          - summary: Query summary with stats (min, max, avg, current per series)
          - query: Query metadata (promql, start_time, end_time)

      Examples:
          - chart_render(metric="cpu_request_ratio", time_window="6h")
          - chart_render(metric="memory_request_ratio", time_window="1d", chart_type="area")
          - chart_render(metric="request_count", capability="flogo", app_id="my-app")

      Note: Charts are returned as base64-encoded data, no files saved.
    inputSchema:
      additionalProperties: false
      properties:
        metric:
          type: string
        query_type:
          default: range
          type: string
        capability:
          default: bwce
          type: string
        time_window:
          default: 1h
          type: string
        start_time:
          default: ""
          type: string
        end_time:
          default: ""
          type: string
        aggregate_function:
          default: avg_over_time
          type: string
        interval:
          default: 5m
          type: string
        app_id:
          default: ""
          type: string
        data_plane:
          default: ""
          type: string
        chart_type:
          default: line
          type: string
        title:
          default: ""
          type: string
        width:
          default: 1200
          type: integer
        height:
          default: 600
          type: integer
        output_format:
          default: png+html
          type: string
      required:
        - metric
      type: object
    annotations:
      title: Chart Render
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
  - name: chart_dashboard
    description: |-
      Create multi-panel dashboard comparing multiple metrics side-by-side.

      Two modes:
        1. Direct fetch (recommended): pass metric names — the server fetches
           all data from Prometheus and generates the dashboard in one call.
           No data relay through the LLM.
        2. Pre-fetched data: pass metrics_data JSON (legacy, not recommended).

      Args:
          metrics: Comma-separated metric shortcuts to fetch and chart.
              e.g. "cpu_request_ratio,memory_request_ratio"
              Shortcuts: cpu_request_ratio, cpu_limit_ratio, memory_request_ratio,
              memory_limit_ratio, request_count, execution_time
          metrics_data: (Legacy) JSON string with pre-fetched metrics data.
              Only used when metrics is empty.
          capability: bwce, flogo, or bw5ce. Default: "bwce"
          time_window: Relative time window - 1h, 6h, 1d, 7d, 30d. Default: "1h"
          start_time: (Optional) Absolute start time (ISO 8601). Overrides time_window.
          end_time: (Optional) Absolute end time (ISO 8601). Used with start_time.
          aggregate_function: PromQL aggregation. Default: "avg_over_time"
          interval: Aggregation interval - 5m, 15m, 1h. Default: "5m"
          app_id: (Optional) Application ID(s), comma-separated.
              If unknown, call listApps first to discover valid values.
          data_plane: Data plane ID or name. Strongly recommended.
              Auto-resolution may fail — if so, call listApps to get the
              data_plane value and pass it explicitly.
          title: Dashboard title (default: "Multi-Metric Dashboard")
          width: Dashboard width (default: 1400)
          height: Dashboard height (default: 800)
          output_format: "png", "html", or "png+html" (default: "png+html")

      Returns:
          JSON with base64-encoded png_data and/or html_data

      Examples:
          Direct fetch (recommended):
          - chart_dashboard(metrics="cpu_request_ratio,memory_request_ratio",
              app_id="rest-bwce-1", data_plane="k8s-auto-dp1", time_window="6h")
          Legacy:
          - chart_dashboard(metrics_data="<json>")

      Note: Dashboard is returned as base64-encoded data, no files saved.
    inputSchema:
      additionalProperties: false
      properties:
        metrics:
          default: ""
          type: string
        metrics_data:
          default: ""
          type: string
        capability:
          default: bwce
          type: string
        time_window:
          default: 1h
          type: string
        start_time:
          default: ""
          type: string
        end_time:
          default: ""
          type: string
        aggregate_function:
          default: avg_over_time
          type: string
        interval:
          default: 5m
          type: string
        app_id:
          default: ""
          type: string
        data_plane:
          default: ""
          type: string
        title:
          default: Multi-Metric Dashboard
          type: string
        width:
          default: 1400
          type: integer
        height:
          default: 800
          type: integer
        output_format:
          default: png+html
          type: string
      type: object
    annotations:
      title: Chart Dashboard
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
  - name: chart_before_after
    description: |-
      Generate before/after comparison chart — fetches data server-side.

      ALWAYS use server-side mode: pass metric, before_start, before_end,
      after_start, after_end. The tool fetches data from Prometheus directly
      and generates the chart in one call. Do NOT call query_metrics first.

      Legacy mode (before_data/after_data JSON strings) is deprecated and
      unreliable — the LLM often truncates or corrupts the time series data.

      Args:
          metric: Metric shortcut or raw PromQL name.
              Shortcuts: cpu_request_ratio, cpu_limit_ratio, memory_request_ratio,
              memory_limit_ratio, request_count, execution_time
          capability: bwce, flogo, bw5ce. Default: "bwce"
          before_start: ISO 8601 start time for "before" window (e.g. "2026-03-28T17:00:00Z")
          before_end: ISO 8601 end time for "before" window
          after_start: ISO 8601 start time for "after" window
          after_end: ISO 8601 end time for "after" window
          aggregate_function: PromQL aggregation. Default: "avg_over_time"
          interval: Aggregation interval. Default: "5m"
          app_id: (Optional) Application ID(s), comma-separated.
          data_plane: Data plane ID or name. Strongly recommended.
          title: Chart title. Default: "Before/After Comparison"
          width: Chart width in pixels. Default: 1200
          height: Chart height in pixels. Default: 600
          output_format: "png", "html", or "png+html". Default: "png+html"
          before_data: (Legacy) JSON string for "before" period. Use server-side mode instead.
          after_data: (Legacy) JSON string for "after" period. Use server-side mode instead.
          metric_name: (Legacy) Alias for metric parameter. Deprecated.

      Returns:
          JSON with base64-encoded png_data and/or html_data, change percentage

      Examples:
          - chart_before_after(metric="cpu_request_ratio", app_id="my-app",
              data_plane="k8s-auto-dp1",
              before_start="2026-03-28T17:00:00Z", before_end="2026-03-28T18:00:00Z",
              after_start="2026-03-28T19:00:00Z", after_end="2026-03-28T20:00:00Z")
          - "Compare CPU before and after deployment"
          - "Show memory comparison between yesterday 2-3pm and today 2-3pm"

      Note: Charts are returned as base64-encoded data, no files saved.
    inputSchema:
