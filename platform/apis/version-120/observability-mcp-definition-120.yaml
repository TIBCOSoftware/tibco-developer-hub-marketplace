        after_start:
          default: ""
          type: string
        after_end:
          default: ""
          type: string
        aggregate_function:
          default: avg_over_time
          type: string
        interval:
          default: 5m
          type: string
        app_id:
          default: ""
          type: string
        data_plane:
          default: ""
          type: string
        title:
          default: Before/After Comparison
          type: string
        width:
          default: 1200
          type: integer
        height:
          default: 600
          type: integer
