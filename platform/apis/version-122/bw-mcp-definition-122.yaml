    description: |

      Name / Purpose:

      List or inspect BW5 on-prem Control Tower (CT) service instances: the data-plane-wide paginated/filtered list, per-application service-instance details, engine control, repository instance configuration, and service-instance configuration sections.

      Output / Returns:
      - The raw Control Tower service-instances JSON for the selected view
      - view='' and view=details rows carry the engine locator: 'serviceInstance' is the '<machineName> - <engine>' display form, 'archiveInstance' is the bare engine name and 'processArchiveName' is the '.par' file name. Read them here, then pass them to view=engine-control

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
