serverInfo:
  name: BWMCPServer
  title: BW MCP Server
  version: 1.22.0
capabilities:
  logging: {}
  tools:
    listChanged: true
tools:
  - name: bw5ct_get_applications
    description: |

      Name / Purpose:

      List or inspect BW5 on-prem Control Tower (CT) deployed applications and their related data: the data-plane-wide application list, archive files, deployment history, upgrade availability, folder structure/hierarchy, and application variables (global/engine/repository).

      Output / Returns:
      - The raw Control Tower applications JSON for the selected view
      - view=folders returns a nested ARRAY of {label, items} folder nodes. 'label' is one path segment, NOT a full path, so do not report it as a path; 'items' holds the child folders in the same shape. An empty array means the machine has no application folders. When sourceFolderPath is supplied the anchor folder is itself the single top-level entry
      - view=folders answers 'what folders exist', NOT 'does application X exist' or 'which folder is it in'. For those, list applications (no domain, no view) and read each row's name and path, optionally narrowing with folderPath or appNameFilter
      - view=upgrades returns {upgradeAvailable, message, appNames, upgradeSummary, selectSoftwares, deploymentOptions}. 'upgradeAvailable': false is a SUCCESSFUL answer meaning the application is already on the latest software - it is not an error, not the 'success: false' pattern below, and not worth retrying. KNOWN LIMITATION: an appName the API does not recognise returns that identical body, and 'appNames' only echoes back the request, so confirm the name against the application list before reporting an application as up to date
      - In view=upgrades, 'selectSoftwares' / 'upgradeFrom' / 'upgradeTo' are SOFTWARE NAMES ('TIBCO ActiveMatrix BusinessWorks 5.16.1'), NOT version numbers ('5.16.1'); 'upgradeSummary' is keyed by the fully-qualified '<domain>-<app>' deployment name; 'deploymentOptions' is the raw upstream default and is informational only
      - view=archive-files and the variables views return an ARRAY of {default, deployable, deployed, description, id, key} rows ('-' or an empty string means none). An archive-files row's 'key' is a process archive file name: pass it as archiveFile with view=engine-variables. In a variable row 'deployed' is the value the running deployment uses, 'deployable' the value staged for the next deployment and 'default' the value built into the archive
      - view=fetch-history distinguishes its failures: 400 means appName was omitted or machineName is not in the domain, 404 means no such deployment on that machine in that domain (usually a misspelt appName), and 501/502 are agent-side and not fixable by changing arguments

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
      - dataplaneName (string, optional): name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required. Supplying both is checked rather than merged: an id and a name that identify different data planes is an error, not a preference
      - domain (string, optional): the domain that owns the application; omit (with no view) to list all applications across the data plane
      - view (string, optional): selects a sub-resource (requires domain). Allowed values: archive-files, fetch-history, upgrades, folders, folders-hierarchy, folders-details, global-variables, engine-variables, repository-variables
      - appName (string, optional): application name; required by archive-files, fetch-history, upgrades and the variables views. Send the BARE name - fetch-history strips a '<domain>-' prefix and upgrades adds one when it is absent, so a name that comes back longer than the one you sent is the same application. One application per call
      - sourceFolderPath (string, optional): LOGICAL folder path in the Application Management repository; used by view=folders to ANCHOR the tree (e.g. 'Divya' or 'sampada/test'). Omit it - or pass '/' - for the whole tree. A path that does not exist is a 404 naming the segment that could not be resolved and listing the folders that DO exist at that level; it is not an empty result
      - name (string, optional): the folder's own NAME, not a path (e.g. 'MyFolder'); required by view=folders-details
      - parentFolderPath (string, optional): LOGICAL Application Management folder path to anchor the tree; omit to start at the Application Management root; used by view=folders-hierarchy
      - archiveFile (string, optional): process archive FILE NAME only (e.g. 'Process Archive.par'), not a path; used by view=engine-variables
      - machineName (string, optional): machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines - resend with one of them. Not used by the data-plane-wide list operations
      - appNameFilter, pathNameFilter, deployabilityFilter, selectedDeploymentState, sortKey, sortOrder, folderPath, domainNames (string, optional) and pageNo, applicationListLength (int, optional): filters/paging for the top-level application list (no domain). appNameFilter is a SUBSTRING match, so it narrows a listing but is not by itself an exact existence check
      - 'folderPath', 'sourceFolderPath', 'parentFolderPath' and 'pathNameFilter' are LOGICAL folders inside the BW5 Application Management repository, NOT filesystem paths on any host. Never pass an operating-system path such as C:/tibco/... or /opt/tibco/....

      Limitations / Notes:
      - These are BW5 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - 'appName' is the deployed BW5 application (EAR) name; 'siname' / 'serviceInstanceName' is a service instance of that application; 'machineName' is the Hawk agent that hosts it.
      - This API answers some client-side mistakes (an unknown appName, an unconfigured transport) with HTTP 500 rather than 400/404. If the error text names a value you supplied, correct that argument instead of retrying, and retry at most once: a repeated identical failure means the Hawk agent or the data plane is down. Some operations now reject precisely with a 400 or 404 instead; where that is so it is stated on the view concerned.
      - Error text may also name internal backend machinery ('Microagent', 'Hawk', a method name). Judge such an error by the rule above: if it also names a value you supplied, fix that argument; if it does not, the internal detail is not something you can act on, so report it rather than retrying with different arguments.
      - HTTP 501 and 502 are the exception to that rule: they can name a value you supplied and still not be your mistake. 501 means the machine's TIBCO Runtime Agent cannot serve the method at all; 502 means the Hawk console accepted the request and reported a failure of its own (for example 'Agent <name> is Down'). Report either one - do not hunt for a different argument, and do not retry.
      - A few operations report failure inside a successful HTTP 200 body via a 'success: false' / 'message' pair; check those fields before treating the payload as valid data.
    inputSchema:
      type: object
      properties:
        bw5CTBaseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            machineName:
              type: string
              description: 'Optional, machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines. Not used by the data-plane-wide list operations'
          additionalProperties: false
        domain:
          type: string
          description: Optional, the domain that owns the application; omit (with no view) to list all applications across the data plane
        view:
          type: string
          description: 'Optional, sub-resource selector (requires domain). Allowed values: archive-files, fetch-history, upgrades, folders, folders-hierarchy, folders-details, global-variables, engine-variables, repository-variables'
        appName:
          type: string
          description: Optional, application name; required by archive-files, fetch-history, upgrades and the variables views. Send the BARE name - fetch-history strips a <domain>- prefix and upgrades adds one when absent, so both spellings reach the same deployment. One application per call
        sourceFolderPath:
          type: string
          description: Optional, LOGICAL folder path in the BW5 Application Management repository - NOT a filesystem path on any host. Anchors the view=folders tree, relative to the Application Management root (e.g. Divya or sampada/test); omit it or pass / for the whole tree. A path that does not exist is a 404 naming the unresolved segment, not an empty list
        name:
          type: string
          description: Optional, the folder's own NAME and not a path (e.g. MyFolder); required by view=folders-details
        parentFolderPath:
          type: string
          description: Optional, LOGICAL Application Management folder path to anchor the tree - NOT a filesystem path on any host; omit to start at the Application Management root; used by view=folders-hierarchy
        archiveFile:
          type: string
          description: Optional, process archive FILE NAME only (e.g. Process Archive.par) and not a path; used by view=engine-variables
        pageNo:
          type: integer
          description: Optional, page number (1-based) for the top-level application list
        applicationListLength:
          type: integer
          description: Optional, page size for the top-level application list
        appNameFilter:
          type: string
          description: Optional, application-name filter for the top-level application list. A SUBSTRING match, so it narrows a listing but is not by itself an exact existence check
        pathNameFilter:
          type: string
          description: Optional, filter on the application's LOGICAL Application Management repository path - NOT a filesystem path; for the top-level application list
        deployabilityFilter:
          type: string
          description: Optional, deployability filter for the top-level application list
        selectedDeploymentState:
          type: string
          description: Optional, deployment-state filter for the top-level application list
        sortKey:
          type: string
          description: Optional, sort key for the top-level application list
        sortOrder:
          type: string
          description: Optional, sort order for the top-level application list
        folderPath:
          type: string
          description: Optional, exact LOGICAL Application Management folder path to restrict the top-level application list to - NOT a filesystem path on any host
        domainNames:
          type: string
          description: Optional, comma-separated domain names for the top-level application list
      required:
        - bw5CTBaseInput
      additionalProperties: false
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
  - name: bw5ct_get_domain_overview
    description: |

      Name / Purpose:

      Get a domain-wide overview of a BW5 on-prem Control Tower (CT) by aggregating the domain machines, the installed software and the domain-filtered service-instances list into a single response.

      Output / Returns:
      - A combined JSON object with machines, installedSoftware and serviceInstances.
      - Sections are fail-soft: a section that could not be fetched holds a STRING beginning 'error: ' instead of its payload. Check each section for that prefix before using it; the call itself still succeeds.
      - 'machines', 'installedSoftware' and 'serviceInstances' are null when the backend answered with an empty body.

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
      - dataplaneName (string, optional): name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required. Supplying both is checked rather than merged: an id and a name that identify different data planes is an error, not a preference
      - domain (string, required): the domain to summarize
      - machineName (string, optional): machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines - resend with one of them. Not used by the data-plane-wide list operations

      Limitations / Notes:
      - These are BW5 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - 'appName' is the deployed BW5 application (EAR) name; 'siname' / 'serviceInstanceName' is a service instance of that application; 'machineName' is the Hawk agent that hosts it.
      - This API answers some client-side mistakes (an unknown appName, an unconfigured transport) with HTTP 500 rather than 400/404. If the error text names a value you supplied, correct that argument instead of retrying, and retry at most once: a repeated identical failure means the Hawk agent or the data plane is down. Some operations now reject precisely with a 400 or 404 instead; where that is so it is stated on the view concerned.
      - Error text may also name internal backend machinery ('Microagent', 'Hawk', a method name). Judge such an error by the rule above: if it also names a value you supplied, fix that argument; if it does not, the internal detail is not something you can act on, so report it rather than retrying with different arguments.
      - HTTP 501 and 502 are the exception to that rule: they can name a value you supplied and still not be your mistake. 501 means the machine's TIBCO Runtime Agent cannot serve the method at all; 502 means the Hawk console accepted the request and reported a failure of its own (for example 'Agent <name> is Down'). Report either one - do not hunt for a different argument, and do not retry.
      - A few operations report failure inside a successful HTTP 200 body via a 'success: false' / 'message' pair; check those fields before treating the payload as valid data.
      - Any filesystem path in a RESPONSE (e.g. 'componentPath', the path embedded in 'productName', or the classpath entries in service-instance server-settings) is a location on the remote BW5 machine, resolved by the Hawk agent on that host. It is never a path on the machine running this client: quote it back as text, never open, list or execute it.
      - This is an aggregation tool; use the dedicated bw5ct_get_* tools for filtered or paginated data.
    inputSchema:
      type: object
      properties:
        bw5CTBaseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            machineName:
              type: string
              description: 'Optional, machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines. Not used by the data-plane-wide list operations'
          additionalProperties: false
        domain:
          type: string
          description: Required, the domain to summarize
      required:
        - bw5CTBaseInput
        - domain
      additionalProperties: false
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
  - name: bw5ct_get_domains
    description: |

      Name / Purpose:

      List BW5 on-prem Control Tower (CT) domains, or read a domain's license status. A domain is the top-level administrative grouping in BW5.

      Output / Returns:
      - The raw Control Tower domains JSON (list, or the license-status view)

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
      - dataplaneName (string, optional): name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required. Supplying both is checked rather than merged: an id and a name that identify different data planes is an error, not a preference
      - domain (string, optional): a domain name; omit (with no view) to list all domains, provide with a view to read a domain sub-resource
      - view (string, optional): domain sub-resource; requires domain. Allowed values: license-status. Supplying a view without a domain is rejected rather than silently answered with the domain list
      - machineName (string, optional): machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines - resend with one of them. Not used by the data-plane-wide list operations

      Limitations / Notes:
      - These are BW5 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - 'appName' is the deployed BW5 application (EAR) name; 'siname' / 'serviceInstanceName' is a service instance of that application; 'machineName' is the Hawk agent that hosts it.
      - This API answers some client-side mistakes (an unknown appName, an unconfigured transport) with HTTP 500 rather than 400/404. If the error text names a value you supplied, correct that argument instead of retrying, and retry at most once: a repeated identical failure means the Hawk agent or the data plane is down. Some operations now reject precisely with a 400 or 404 instead; where that is so it is stated on the view concerned.
      - Error text may also name internal backend machinery ('Microagent', 'Hawk', a method name). Judge such an error by the rule above: if it also names a value you supplied, fix that argument; if it does not, the internal detail is not something you can act on, so report it rather than retrying with different arguments.
      - HTTP 501 and 502 are the exception to that rule: they can name a value you supplied and still not be your mistake. 501 means the machine's TIBCO Runtime Agent cannot serve the method at all; 502 means the Hawk console accepted the request and reported a failure of its own (for example 'Agent <name> is Down'). Report either one - do not hunt for a different argument, and do not retry.
      - A few operations report failure inside a successful HTTP 200 body via a 'success: false' / 'message' pair; check those fields before treating the payload as valid data.
    inputSchema:
      type: object
      properties:
        bw5CTBaseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            machineName:
              type: string
              description: 'Optional, machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines. Not used by the data-plane-wide list operations'
          additionalProperties: false
        domain:
          type: string
          description: Optional, a domain name; omit to list all domains, provide with a view to read a domain sub-resource
        view:
          type: string
          description: 'Optional, domain sub-resource (requires domain). Allowed values: license-status. A view without a domain is rejected rather than silently answered with the domain list'
      required:
        - bw5CTBaseInput
      additionalProperties: false
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
  - name: bw5ct_get_events_rulebases
    description: |

      Name / Purpose:

      List or inspect BW5 on-prem Control Tower (CT) configured monitoring events and Hawk rulebases: list configured events, read a configured event's details, or list rulebases at machine or process-archive scope.

      Output / Returns:
      - The raw Control Tower events/rulebases JSON for the selected view
      - view=events lists its rows under 'data' (with 'total'), each {Description, Event Type, ID}: 'ID' is the event's identifier; 'Event Type' (e.g. 'Log Event') is the KIND of event, NOT an identifier. An empty 'data' means no events are configured at that scope
      - For view=rulebases each entry carries its own 'id'. Rulebase file NAMES are NOT unique at a scope: the same .hrb can be installed several times, each occurrence with a distinct id. Treat 'id' as the identity, report it alongside the name, and never assume a name identifies exactly one rulebase when counting or reporting.
      - A view=rulebases row is just {id, rulebases}: the file name is carried in the field literally named 'rulebases' (plural) even though it holds ONE name. This is the shape at BOTH the machine and the process-archive scope. An empty result at a scope is a normal, successful answer meaning nothing is installed there.

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
      - dataplaneName (string, optional): name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required. Supplying both is checked rather than merged: an id and a name that identify different data planes is an error, not a preference
      - domain (string, required): the domain to query
      - view (string, required): what to read. Allowed values: events, event-details, rulebases
      - eventScope (string, optional): monitoring-event family for view=events/event-details (the API calls it 'scope'). Allowed values: domain (default), process-archive. Event IDs never cross scopes: read an event's details with the scope, appName and processArchiveName it was listed under
      - rulebaseScope (string, optional): rulebase scope; required by view=rulebases. Allowed values: machine, process-archive
      - eventId (string, optional): the 'ID' of a view=events row, not its 'Event Type'; required by view=event-details
      - machineId (string, optional): the 'machineId' of a bw5ct_get_machines row; used only by view=event-details at eventScope=domain (ignored at process-archive scope)
      - appName (string, optional): application name; required when the scope is process-archive, and rejected at any other scope (eventScope=domain, rulebaseScope=machine), which would ignore it
      - processArchiveName (string, optional): process archive (.par) name; required when the scope is process-archive, and rejected at any other scope like appName
      - machineName (string, optional): machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines - resend with one of them. Not used by the data-plane-wide list operations

      Limitations / Notes:
      - These are BW5 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - 'appName' is the deployed BW5 application (EAR) name; 'siname' / 'serviceInstanceName' is a service instance of that application; 'machineName' is the Hawk agent that hosts it.
      - This API answers some client-side mistakes (an unknown appName, an unconfigured transport) with HTTP 500 rather than 400/404. If the error text names a value you supplied, correct that argument instead of retrying, and retry at most once: a repeated identical failure means the Hawk agent or the data plane is down. Some operations now reject precisely with a 400 or 404 instead; where that is so it is stated on the view concerned.
      - Error text may also name internal backend machinery ('Microagent', 'Hawk', a method name). Judge such an error by the rule above: if it also names a value you supplied, fix that argument; if it does not, the internal detail is not something you can act on, so report it rather than retrying with different arguments.
      - HTTP 501 and 502 are the exception to that rule: they can name a value you supplied and still not be your mistake. 501 means the machine's TIBCO Runtime Agent cannot serve the method at all; 502 means the Hawk console accepted the request and reported a failure of its own (for example 'Agent <name> is Down'). Report either one - do not hunt for a different argument, and do not retry.
      - A few operations report failure inside a successful HTTP 200 body via a 'success: false' / 'message' pair; check those fields before treating the payload as valid data.
      - At process-archive scope (eventScope or rulebaseScope=process-archive) a wrong appName or processArchiveName is rejected precisely rather than with the HTTP 500 above: a 404 means appName names no deployment on that machine in that domain, or processArchiveName names no archive within it, and the message says which. Correct that argument - do NOT read the 404 as 'nothing is configured or installed there', which is a 200 with an empty result.
      - view=event-details checks eventId first: a 404 means it is not configured at the selected scope, and the message lists the IDs that are (or says none is) and flags an Event Type or description sent in place of an ID - pick an ID from it, or from view=events at that scope. A 502 means the configured events could not be listed to check the ID; report it.
    inputSchema:
      type: object
      properties:
        bw5CTBaseInput:
          type: object
          properties:
            dataPlaneId:
              type: string
              description: Optional, BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            dataplaneName:
              type: string
              description: Optional, name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required, use 'listDataplanes' tool to list available data planes
            machineName:
              type: string
              description: 'Optional, machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines. Not used by the data-plane-wide list operations'
          additionalProperties: false
        domain:
          type: string
          description: Required, the domain to query
        view:
          type: string
          description: 'Required, what to read. Allowed values: events, event-details, rulebases'
        eventScope:
          type: string
          description: 'Optional, monitoring-event family for view=events/event-details (the API calls it scope). Allowed values: domain (default), process-archive. Event IDs never cross scopes: read details with the scope the event was listed under'
        rulebaseScope:
          type: string
          description: 'Optional, rulebase scope; required by view=rulebases. Allowed values: machine, process-archive'
        eventId:
          type: string
          description: Optional, the ID field of a view=events row, not its Event Type (e.g. Log Event); required by view=event-details
        machineId:
          type: string
          description: Optional, the machineId of a bw5ct_get_machines row; used only by view=event-details at eventScope=domain
        appName:
          type: string
          description: Optional, application name; required when the scope is process-archive, and rejected at any other scope (eventScope=domain, rulebaseScope=machine), which would ignore it
        processArchiveName:
          type: string
          description: Optional, process archive (.par) name; required when the scope is process-archive, and rejected at any other scope (eventScope=domain, rulebaseScope=machine), which would ignore it
      required:
        - bw5CTBaseInput
        - domain
        - view
      additionalProperties: false
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
  - name: bw5ct_get_installed_software
    description: |

      Name / Purpose:

      List TIBCO software products installed on a BW5 on-prem Control Tower (CT) domain, optionally scoped to a machine, with optional search and sort. This is the preferred software-inventory tool.

      Output / Returns:
      - The raw Control Tower installed-software JSON: an array of rows with softwareName, displayName, productName, softwareVersion, softwareType, installDate, enabled (a string, 'true'/'false'), machineName, ipAddress, osName, osVersion and componentPath

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW5 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
      - dataplaneName (string, optional): name of the BW5 on-prem Control Tower data plane. Either dataplane id or name is required. Supplying both is checked rather than merged: an id and a name that identify different data planes is an error, not a preference
      - domain (string, required): the domain to query
      - machineName (string, optional): machine (Hawk agent) name to scope the query to. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines
      - searchKey (string, optional): row field to filter on, matched case-insensitively. Allowed values: osVersion, installDate, softwareType, displayName, componentPath, ipAddress, osName, productName, softwareVersion, machineName, enabled, softwareName
      - searchValue (string, optional): substring to match against the searchKey field (case-insensitive); requires searchKey
      - sortBy (string, optional): row field to sort on. Allowed values: osVersion, installDate, softwareType, displayName, componentPath, ipAddress, osName, productName, softwareVersion, machineName, enabled, softwareName
      - sortOrder (string, optional): sort direction, only applied together with sortBy. Allowed values: asc, desc

      Limitations / Notes:
      - These are BW5 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - 'appName' is the deployed BW5 application (EAR) name; 'siname' / 'serviceInstanceName' is a service instance of that application; 'machineName' is the Hawk agent that hosts it.
      - This API answers some client-side mistakes (an unknown appName, an unconfigured transport) with HTTP 500 rather than 400/404. If the error text names a value you supplied, correct that argument instead of retrying, and retry at most once: a repeated identical failure means the Hawk agent or the data plane is down. Some operations now reject precisely with a 400 or 404 instead; where that is so it is stated on the view concerned.
