      - domain (string, optional): the domain. With a view it selects the sub-resource's domain. On the list (view empty) it scopes the list to that domain - the API has no per-domain list operation, so it is sent as domainNames; omit it for the whole data plane
      - view (string, optional): selects a sub-resource (requires domain). Allowed values: details, config, engine-control, repo-instance-config
      - appName (string, optional): application name; required by details/config/engine-control/repo-instance-config
      - section (string, optional): config section; required by view=config. Allowed values: general, server-settings (JVM settings, including the classpath entries on the remote BW5 machine), graceful-shutdown, advanced
      - processArchiveName (string, optional): process archive (.par) name, WITH the '.par' suffix; required by view=config, optional for engine-control. Read it from this tool's own view=details rows, where it is the field literally named 'processArchiveName'. Case-sensitive
      - serviceInstanceName (string, optional): service instance (engine) name; used by view=engine-control. Read it from this tool's own view=details rows: either 'archiveInstance' (the bare engine name, e.g. 'Process Archive') or the full 'serviceInstance' display form ('<machineName> - <engine>'), which the wrapper trims to the engine name. The engine name is the process archive WITHOUT its '.par' suffix, so 'Timer30Sec.par' is driven by the engine 'Timer30Sec'. Case-sensitive, and never '<appName>-<archive>' - that form looks plausible but can never match a deployed instance (BW-23197). A name that matches nothing is rejected with the list of instances that do exist; read that list rather than guessing again
      - archiveInstanceName (string, optional): service (archive) instance name; required by view=config
      - transport (string, optional): repository transport; used by view=repo-instance-config. Allowed values: local (default, the common on-prem case), http, rv. Config is stored per transport, so the transport must actually be configured for the deployment or the read fails; http/rv apply only to TIBCO Rendezvous domains
      - serviceInstanceNameFilter, applicationNameFilter, selectedState, domainNames (string, optional), page, limit (int, optional): filters/paging for the data-plane-wide list. domainNames takes precedence over domain when both are given
      - sortBy (string, optional): a JSON OBJECT encoded as a string, e.g. '{"column":"ftgroup","order":"asc"}'; the API declares this parameter as JSON-in-query, so a bare column name will not sort
      - domainFilter (string, optional): a JSON ARRAY encoded as a string, e.g. '["emsdomain1"]'; also JSON-in-query. Prefer domainNames for a simple single-domain filter
      - machineName (string, optional): machine (Hawk agent) name. Omit it in a single-machine domain (resolved server-side). In a domain with more than one machine send it: omitting it there, or naming a machine not in the domain, is a 400 listing the valid machines - resend with one of them. Not used by the data-plane-wide list operations

