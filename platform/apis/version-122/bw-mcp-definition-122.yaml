      - pageSize (int, optional): page size; alone it returns the first page. ONLY the domain list (bw6ct_get_domains) pages
      - domain (string, required): the domain that owns the appspaces
      - appspace (string, optional): an appspace name; required to read a configuration view
      - view (string, optional): appspace configuration sub-resource; requires appspace. Allowed values: config-general, config-user

