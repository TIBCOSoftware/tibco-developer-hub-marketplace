      - These are BW6 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - Runtime status is ALWAYS returned by the views that carry it - read it from each row's 'status'. There is nothing to ask for and no way to switch it off: the showStatus query parameter was removed from the API and pinned on server-side (AMBW-58536), so sending it is rejected as an unknown argument. Not every view carries status - a domain row, for instance, has none.
