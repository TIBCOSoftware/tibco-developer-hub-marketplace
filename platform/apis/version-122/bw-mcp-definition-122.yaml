      - In mode=metrics the object {"noRecord": "No Record Found !"} is a NORMAL, successful EMPTY result meaning the metric query matched nothing. It is not an error, not a 'success: false' body, and not a sign that the service instance, the Hawk agent or the data plane is down - do not retry it; call again with mode=live to read the starter state

