  - name: bw6ct_get_agents
    description: |

      Name / Purpose:

      List BW6 on-prem Control Tower (CT) BW agents for the data plane or a domain, or read an agent's app nodes or configuration.

      Output / Returns:
      - The raw Control Tower agents JSON (list or the selected agent sub-resource)

      Arguments / Parameters:
      - dataPlaneId (string, optional): BW6 on-prem Control Tower data plane id (path segment in the CT API). Either dataplane id or name is required - use the 'listDataplanes' tool to list available data planes
      - dataplaneName (string, optional): name of the BW6 on-prem Control Tower data plane. Either dataplane id or name is required. Supplying both is checked rather than merged: an id and a name that identify different data planes is an error, not a preference
      - networkName (string, optional): BW6 agent network name (networkName query param); accepted by every operation. Omit to let Control Tower auto-derive it when the data plane has exactly one agent network
      - sortBy (string, optional): column to sort by. Accepted by the domain, machine, agent, installation, appnode and archive lists, the application instances view and the archive deployed/appspaces/profiles views, each rejecting an unknown column with a 400 listing the valid ones; the appspace list and the application lists do not sort
      - sortOrder (string, optional): sort order: ascending or descending. Accepted wherever sortBy is
      - nameFilter (string, optional): keeps rows whose name contains this text, case-insensitively and literally (no wildcards); the instances view also matches appNode and the archive deployed view appSpaceName. Accepted only by the domain list, the domain machine list, the application instances view and the archive deployed/appspaces/profiles views
      - pageNumber (int, optional): 1-based page number; requires pageSize. ONLY the domain list (bw6ct_get_domains) pages
      - pageSize (int, optional): page size; alone it returns the first page. ONLY the domain list (bw6ct_get_domains) pages
      - domain (string, optional): scope the agent list to a domain (combine with appspace and/or machine filters)
      - appspace (string, optional): filter the domain agent list to an appspace (requires domain)
      - machine (string, optional): filter the domain agent list to a machine (requires domain)
      - agent (string, optional): a BW agent name, spelled exactly as the agent list shows it (case-sensitive); with a view, reads one of its sub-resources
      - view (string, optional): sub-resource of an agent; requires agent. Allowed values: appnodes, configs

      Limitations / Notes:
      - These are BW6 on-prem Control Tower (CT) READ-ONLY operations.
      - The raw Control Tower API JSON is passed through as the response.
      - Runtime status is ALWAYS returned by the views that carry it - read it from each row's 'status'. There is nothing to ask for and no way to switch it off: the showStatus query parameter was removed from the API and pinned on server-side (AMBW-58536), so sending it is rejected as an unknown argument. Not every view carries status - a domain row, for instance, has none.
      - Paging, sorting and name filtering are declared per operation in the Control Tower contract, and most operations declare none of them. This server sends each one only to the operations that accept it, so setting one on a view that does not support it simply has no effect - it does not silently half-apply. Assume a result set is complete and in the API's own order unless the parameter is listed as accepted above.
      - Branch on error.code. 'DP_NOT_FOUND', 'DP_NO_BW6_CAPABILITY' (404) or 'DP_ID_INVALID' (400): the data plane id is unknown, not BW6 or malformed - re-pick it with 'listDataplanes'; no name was looked up yet. Any other 404 code names the missing object - 'DOMAIN_NOT_FOUND', 'APPSPACE_NOT_FOUND', 'APPLICATION_NOT_FOUND', 'APPNODE_NOT_FOUND', 'AGENT_NOT_FOUND' or 'ARCHIVE_NOT_FOUND' - and its message may give the stored spelling or deployed versions: fix that one name (or the folder or scope that qualifies it), never resend the same request unchanged. 'PARAM_INVALID' (400) names an argument refused as given. A read that names a scope reports it missing rather than an empty list, so an empty result normally means it exists and is empty - but a filter other than appspace never reports a missing name.
      - A bare code of '400': a required value is missing or not allowed - on these reads that is networkName when it cannot be chosen automatically: the message lists the registered agent networks to resend one of, or says none is registered - which is also what a failed Control Plane lookup of the agent networks answers, so retry once and do not guess a networkName (one you supply skips that lookup).
      - 'BW-ADAPTER-1000' (400): the BW agent rejected the request or could not be reached - read 'Details': a connection error there (refused, reset, timed out; 'failed to invoke TEA agent task') means the data plane's TEA agent is down or unreachable, so every bw6ct_* read fails the same way until it is back and no change of names or arguments fixes it - stop and report the outage. Otherwise - and for any other BW-ADAPTER error.code, which an unknown networkName answers - the request was refused as sent: report the code and text, and change an argument only when that text names it (a networkName: omit it, or resend one the bare-'400' message lists).
      - HTTP 502 is an upstream failure. error.code 'UPSTREAM_TASK_FAILED': the BW agent received and ran the request but returned no usable result - a retry alone will not change it; 'Details' carries the agent's own response: report what it says. It does not by itself mean an argument was wrong, but when the server could not check the names it relays this instead of a not-found, so confirm each domain/appspace/appnode/application name once against its parent list before reporting. A bare code of '502': the Control Plane lookup of this data plane's BW6 capability failed, so the request was not sent - it is not caused by your arguments and carries no 'Details'; retry later, once - if it repeats, report it. A down TEA agent is not a 502 on these reads but 'BW-ADAPTER-1000' (400), above; and a read the agent cannot answer in time (a wedged agent, or one routed to a BW agent whose machine is listed as Unreachable) can instead hang about two minutes and fail with HTTP 504 and no body - report it rather than retrying.
