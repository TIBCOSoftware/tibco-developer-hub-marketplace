# Integration apps — TIBCO BW6 / Flogo applications.
# All graph edges are declared here (the TIBCO Developer Hub's built-in processor generates
# provides/consumes/dependsOn relations from the Component side):
#   providesApis / consumesApis -> message contract edges (drive impact analysis)
#   dependsOn                    -> SAP backend + EMS destination infrastructure edges
#
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-intake-bw6
  description: BW6 app — receives sales orders from SAP S/4HANA and publishes production orders
  tags:
    - bw6
    - integration
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: Receipt
      iconTooltip: Order Intake (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:manufacturing-order-management-team
  system: sap-integration-hub
  consumesApis:
    - sales-order-msg
    - material-master-msg
  providesApis:
    - production-order-msg
  dependsOn:
    - resource:sap-s4hana
    - resource:manufacturing-ems-server
    - resource:ems-q-sales-order-inbound
    - resource:ems-t-production-order-created
