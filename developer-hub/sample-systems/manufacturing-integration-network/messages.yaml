# Message contracts — each EMS topic/queue message is modelled as a kind: API
# whose definition holds the XSD / JSON Schema INLINE.
#
# type: ems-message (a neutral custom type) — NOT 'asyncapi'/'openapi'. The api-docs
# Definition tab picks a strict renderer by spec.type: 'asyncapi' would validate the
# text as an AsyncAPI document and error ("not an AsyncAPI document") because our
# payload is an XSD / JSON Schema, not an AsyncAPI spec. An unrecognized type falls
# back to a plain raw view, which displays the schema as-is. Topology and impact
# analysis don't depend on the type.
#
# NOTE: definitions are inlined (definition: |) rather than referenced via
# `$text: ./schemas/..` because this local backend has no UrlReader for `file:`
# URLs, so local-file $text placeholders silently drop the entity. ($text works
# only when the catalog file is read from a Git URL.) Inlining is reliable for a
# local sample — to demo impact analysis, edit the schema in the block below and
# re-run the impact-analysis skill on the message.
#
# Modelling messages as APIs is what makes impact analysis work: every component
# that consumesApis a message becomes an `apiConsumedBy` = direct-impact consumer.
# (Provider/consumer relations are declared on the components in integration-apps.yaml.)
#
# ── XSD contracts (SAP / IDoc-style, yellow) ─────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sales-order-msg
  description: Sales order message (SAP IDoc ORDERS05) on q.sales-order.inbound
  tags:
    - ems
    - message
    - xsd
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: yellow
    entityIcon:
      icon: Description
      iconTooltip: Message Contract (XSD)
    statusIcons:
      - icon: Code
        iconColor: darkorange
        iconTooltip: XSD Schema
spec:
  type: ems-message
  lifecycle: production
  owner: group:manufacturing-order-management-team
  system: sap-integration-hub
  definition: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!-- Sales Order message — SAP IDoc ORDERS05 (inbound from S/4HANA, q.sales-order.inbound) -->
    <xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                targetNamespace="urn:manufacturer:ems:sales-order"
                xmlns="urn:manufacturer:ems:sales-order"
                elementFormDefault="qualified">
      <xsd:element name="SalesOrder">
        <xsd:complexType>
          <xsd:sequence>
            <xsd:element name="Header" type="HeaderType"/>
            <xsd:element name="Items" type="ItemsType"/>
          </xsd:sequence>
          <xsd:attribute name="idocType" type="xsd:string" fixed="ORDERS05"/>
        </xsd:complexType>
      </xsd:element>
      <xsd:complexType name="HeaderType">
        <xsd:sequence>
          <xsd:element name="OrderNumber" type="xsd:string"/>
          <xsd:element name="OrderType" type="xsd:string"/>
          <xsd:element name="SoldToParty" type="xsd:string"/>
          <xsd:element name="ShipToParty" type="xsd:string"/>
          <xsd:element name="PurchaseOrderRef" type="xsd:string" minOccurs="0"/>
          <xsd:element name="OrderDate" type="xsd:date"/>
          <xsd:element name="RequestedDeliveryDate" type="xsd:date" minOccurs="0"/>
          <xsd:element name="Currency" type="xsd:string"/>
          <xsd:element name="SalesOrg" type="xsd:string"/>
        </xsd:sequence>
      </xsd:complexType>
      <xsd:complexType name="ItemsType">
        <xsd:sequence>
          <xsd:element name="Item" maxOccurs="unbounded">
            <xsd:complexType>
              <xsd:sequence>
                <xsd:element name="ItemNumber" type="xsd:integer"/>
                <xsd:element name="MaterialNumber" type="xsd:string"/>
                <xsd:element name="Description" type="xsd:string" minOccurs="0"/>
                <xsd:element name="Quantity" type="xsd:decimal"/>
                <xsd:element name="Unit" type="xsd:string"/>
                <xsd:element name="NetPrice" type="xsd:decimal" minOccurs="0"/>
                <xsd:element name="Plant" type="xsd:string" minOccurs="0"/>
              </xsd:sequence>
            </xsd:complexType>
          </xsd:element>
        </xsd:sequence>
      </xsd:complexType>
    </xsd:schema>
---
