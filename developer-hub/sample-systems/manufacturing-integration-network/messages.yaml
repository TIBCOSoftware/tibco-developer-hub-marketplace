# ── JSON Schema contracts (internal events, yellow) ──────────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: production-order-msg
  description: Production order created event (JSON Schema) on t.production-order.created
  tags:
    - ems
    - message
    - json-schema
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: yellow
    entityIcon:
      icon: Description
      iconTooltip: Message Contract (JSON Schema)
    statusIcons:
      - icon: Code
        iconColor: seagreen
        iconTooltip: JSON Schema
spec:
  type: ems-message
  lifecycle: production
  owner: group:manufacturing-order-management-team
  system: sap-integration-hub
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:manufacturer:ems:production-order",
      "title": "ProductionOrder",
      "description": "Production order created event on t.production-order.created (order-intake-bw6 -> production-orchestrator-bw6).",
      "type": "object",
      "additionalProperties": false,
      "required": ["productionOrderNumber", "materialNumber", "quantity", "unit", "plant", "scheduledStartDate"],
      "properties": {
        "productionOrderNumber": { "type": "string" },
        "salesOrderRef": { "type": "string" },
        "materialNumber": { "type": "string" },
        "quantity": { "type": "number", "minimum": 0 },
        "unit": { "type": "string", "examples": ["EA", "KG", "L"] },
        "plant": { "type": "string" },
        "workCenter": { "type": "string" },
        "scheduledStartDate": { "type": "string", "format": "date" },
        "scheduledEndDate": { "type": "string", "format": "date" },
        "priority": { "type": "string", "enum": ["LOW", "NORMAL", "HIGH", "URGENT"], "default": "NORMAL" },
        "components": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["materialNumber", "quantity", "unit"],
            "properties": {
              "materialNumber": { "type": "string" },
              "quantity": { "type": "number", "minimum": 0 },
              "unit": { "type": "string" }
            }
          }
        }
      }
    }
---
