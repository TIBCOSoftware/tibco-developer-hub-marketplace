# Integration apps — TIBCO BW6 / Flogo applications.
# All graph edges are declared here (the TIBCO Developer Hub's built-in processor generates
# provides/consumes/dependsOn relations from the Component side):
#   providesApis / consumesApis -> message contract edges (drive impact analysis)
#   dependsOn                    -> backend + EMS destination infrastructure edges
#
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claims-intake-bw6
  description: BW6 app — receives FNOL messages, validates policy coverage and publishes registered claims
  tags:
    - bw6
    - integration
    - claims
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: Receipt
      iconTooltip: Claims Intake (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:claims-intake-team
  system: claims-processing-hub
  consumesApis:
    - fnol-msg
  providesApis:
    - claim-registered-msg
  dependsOn:
    - resource:policy-admin-system
    - resource:insurance-ems-server
    - resource:ems-q-fnol-inbound
    - resource:ems-t-claim-registered
---
