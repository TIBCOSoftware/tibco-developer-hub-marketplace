  tibco.developer.hub/topology:
    theme:
      name: green
    entityIcon:
      icon: Gavel
      iconTooltip: Underwriting Orchestrator (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:underwriting-team
  system: claims-processing-hub
  consumesApis:
    - claim-registered-msg
