# Message contracts — each EMS topic/queue message is modelled as a kind: API
# whose definition holds the JSON Schema INLINE.
#
# type: claims-message (a neutral custom type) — NOT 'asyncapi'/'openapi'. The api-docs
# Definition tab picks a strict renderer by spec.type: 'asyncapi' would validate the
# text as an AsyncAPI document and error ("not an AsyncAPI document") because our
# payload is a JSON Schema, not an AsyncAPI spec. An unrecognized type falls
# back to a plain raw view, which displays the schema as-is. Topology and impact
# analysis don't depend on the type.
#
# NOTE: definitions are inlined (definition: |) rather than referenced via
# `$text: ./schemas/..` because this local backend has no UrlReader for `file:`
# URLs, so local-file $text placeholders silently drop the entity. Inlining is
# reliable for a local sample — to demo impact analysis, edit the schema in the
# block below and re-run the impact-analysis skill on the message.
#
# Modelling messages as APIs is what makes impact analysis work: every component
# that consumesApis a message becomes an `apiConsumedBy` = direct-impact consumer.
# (Provider/consumer relations are declared on the components in integration-apps.yaml.)
#
# ── JSON Schema contracts (claims orchestration messages, yellow) ────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: fnol-msg
  description: First Notice Of Loss message (JSON Schema) on q.fnol.inbound
  tags:
    - ems
    - message
    - json-schema
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: yellow
    entityIcon:
      icon: Description
      iconTooltip: Message Contract (JSON Schema)
    statusIcons:
      - icon: Code
        iconColor: darkorange
        iconTooltip: JSON Schema
spec:
  type: claims-message
  lifecycle: production
  owner: group:claims-intake-team
  system: claims-processing-hub
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:insurer:claims:fnol",
      "title": "FirstNoticeOfLoss",
      "description": "First Notice Of Loss message on q.fnol.inbound (external channel -> claims-intake-bw6).",
      "type": "object",
      "additionalProperties": false,
      "required": ["claimId", "policyNumber", "lossDate", "lossType", "description", "claimant"],
      "properties": {
        "claimId": { "type": "string" },
        "policyNumber": { "type": "string" },
        "lossDate": { "type": "string", "format": "date" },
        "lossType": { "type": "string", "enum": ["AUTO", "HOME", "TRAVEL", "PROPERTY", "LIABILITY"] },
        "description": { "type": "string" },
        "claimant": {
          "type": "object",
          "additionalProperties": false,
          "required": ["name", "contactEmail"],
          "properties": {
            "name": { "type": "string" },
            "contactEmail": { "type": "string", "format": "email" },
            "phone": { "type": "string" }
          }
        }
      }
    }
---
