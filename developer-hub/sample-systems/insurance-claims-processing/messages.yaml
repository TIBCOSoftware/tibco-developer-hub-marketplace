  type: claims-message
  lifecycle: production
  owner: group:underwriting-team
  system: claims-processing-hub
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:insurer:claims:claim-assessment",
      "title": "ClaimAssessment",
      "description": "Claim assessment completed event on t.assessment.completed (underwriting-orchestrator-bw6). Consumed cross-team by payout-service-bw6 and document-processor-flogo.",
      "type": "object",
      "additionalProperties": false,
      "required": ["claimId", "assessedAmount", "decision", "adjuster", "supportingDocs"],
      "properties": {
        "claimId": { "type": "string" },
        "assessedAmount": { "type": "number", "minimum": 0 },
        "decision": { "type": "string", "enum": ["APPROVED", "PARTIAL", "DENIED", "NEEDS_REVIEW"] },
        "adjuster": { "type": "string" },
        "supportingDocs": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["documentId", "documentType"],
            "properties": {
              "documentId": { "type": "string" },
              "documentType": { "type": "string" },
              "receivedDate": { "type": "string", "format": "date" }
            }
          }
        }
      }
    }
