# Infrastructure — insurance backend systems and the TIBCO EMS broker + destinations.
# These are modelled as Resources; integration apps reach them via `dependsOn`.
#
# Each EMS destination also declares `dependencyOf: [api:<message>]` — i.e. "the message
# contract depends on this destination". This gives a clickable link from the queue/topic to
# its message API (and an edge in the system topology).
#
# ── Insurance backends (navy = external systems) ─────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: policy-admin-system
  title: Policy Admin System
  description: Core policy administration system used to confirm coverage and policy status
  tags:
    - insurance
    - policy
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: navy
    entityIcon:
      icon: Description
      iconTooltip: Policy Admin System
    statusIcons:
      - icon: Public
        iconColor: steelblue
        iconTooltip: External System
spec:
  type: policy-system
  lifecycle: production
  owner: group:claims-platform-team
  system: claims-processing-hub
