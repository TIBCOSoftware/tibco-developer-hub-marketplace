    - tibco
    - ems
    - messaging
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: orange
    entityIcon:
      icon: CloudQueue
      iconTooltip: TIBCO EMS Broker
    statusIcons:
      - icon: Lock
        iconColor: forestgreen
        iconTooltip: TLS Enabled
spec:
  type: message-broker
  lifecycle: production
  owner: group:claims-platform-team
  system: claims-processing-hub
---
