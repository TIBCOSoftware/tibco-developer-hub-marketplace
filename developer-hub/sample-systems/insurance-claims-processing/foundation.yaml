# Foundation — Domain, System and owning teams for the insurance
# claims-processing orchestration landscape.
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: insurance
  description: Insurance integration domain — claims intake, underwriting, assessment and payout orchestration
  tags:
    - insurance
    - claims
    - integration
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: Shield
      iconTooltip: Insurance Domain
spec:
  owner: group:claims-platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: claims-processing-hub
  description: Claims processing hub connecting FNOL intake, underwriting, fraud, documents and payout over TIBCO EMS
  tags:
    - insurance
    - claims
    - orchestration
    - ems
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: blue
    entityIcon:
      icon: SwapHoriz
      iconTooltip: Claims Processing Hub
    statusIcons:
      - icon: VerifiedUser
        iconColor: forestgreen
        iconTooltip: Production Ready
spec:
  owner: group:claims-platform-team
  domain: insurance
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: claims-platform-team
  description: Owns the claims-processing hub, TIBCO EMS broker and shared integration platform
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: blue
    entityIcon:
      icon: Group
      iconTooltip: Claims Platform Team
spec:
  type: team
  profile:
    displayName: Claims Platform Team
    email: claims-platform@insurer.example.com
  children: []
