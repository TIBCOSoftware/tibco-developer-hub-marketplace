# Infrastructure — clinical backends (external systems), the TIBCO EMS broker,
# FHIR API gateway and EMS destinations.
#
# Each EMS destination also declares `dependencyOf: [api:<message>]` — i.e. "the message
# contract depends on this destination". This gives a clickable link from the queue/topic to
# its message API (and an edge in the system topology). Note: the API's own overview page will
# not list the destination back — TIBCO Developer Hub API entities only ever surface apiProvidedBy /
# apiConsumedBy / ownedBy / partOf — so the message links back via its producer/consumer apps.
#
# ── Clinical backends (navy = external systems) ──────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: epic-ehr
  title: Epic EHR
  description: Epic electronic health record — ADT source of truth for patient demographics and encounters
  tags:
    - healthcare
    - ehr
    - clinical
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: navy
    entityIcon:
      icon: LocalHospital
      iconTooltip: Epic EHR
    statusIcons:
      - icon: Public
        iconColor: steelblue
        iconTooltip: External System
      - icon: Lock
        iconColor: forestgreen
        iconTooltip: PHI Encrypted
spec:
  type: clinical-system
  lifecycle: production
  owner: group:clinical-integration-team
  system: patient-data-exchange
