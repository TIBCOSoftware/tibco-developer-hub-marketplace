# Integration apps — TIBCO BW6 / Flogo applications.
# All graph edges are declared here (the TIBCO Developer Hub's built-in processor generates
# provides/consumes/dependsOn relations from the Component side):
#   providesApis / consumesApis -> message contract edges (drive impact analysis)
#   dependsOn                    -> clinical backend + EMS destination infrastructure edges
#
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hl7-fhir-bridge-bw6
  description: BW6 app — receives HL7 ADT messages from Epic and publishes normalized FHIR Patient updates
  tags:
    - bw6
    - integration
    - hl7
    - fhir
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: SwapHoriz
      iconTooltip: HL7 to FHIR Bridge (BW6)
    statusIcons:
      - icon: Lock
        iconColor: forestgreen
        iconTooltip: PHI Encrypted
spec:
  type: service
  lifecycle: production
  owner: group:clinical-integration-team
  system: patient-data-exchange
  consumesApis:
    - hl7-adt-msg
  providesApis:
    - fhir-patient-msg
  dependsOn:
    - resource:epic-ehr
    - resource:fhir-api-gateway
    - resource:healthcare-ems-server
    - resource:ems-q-adt-inbound
    - resource:ems-t-patient-updated
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: patient-index-flogo
  description: Flogo app — consumes FHIR Patient updates and updates the master patient index
  tags:
    - flogo
    - integration
    - mpi
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: orange
    entityIcon:
      icon: AccountCircle
      iconTooltip: Patient Index Updater (Flogo)
    statusIcons:
      - icon: VerifiedUser
        iconColor: forestgreen
        iconTooltip: HIPAA Compliant
spec:
  type: service
  lifecycle: production
  owner: group:patient-index-team
  system: patient-data-exchange
  consumesApis:
    - fhir-patient-msg
  dependsOn:
    - resource:master-patient-index
    - resource:healthcare-ems-server
    - resource:ems-t-patient-updated
