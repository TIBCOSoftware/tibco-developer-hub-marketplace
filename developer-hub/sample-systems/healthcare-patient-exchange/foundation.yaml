# Foundation — Domain, System and the owning teams for the healthcare
# HL7 / FHIR patient data exchange landscape.
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: healthcare
  description: Healthcare integration domain — clinical systems bridged through HL7, FHIR and TIBCO EMS messaging
  tags:
    - healthcare
    - integration
    - fhir
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: LocalHospital
      iconTooltip: Healthcare Domain
spec:
  owner: group:healthcare-integration-platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: patient-data-exchange
  description: Patient data exchange connecting clinical, lab, billing, consent and MPI systems via HL7, FHIR, TIBCO EMS and TIBCO integration apps
  tags:
    - healthcare
    - integration
    - fhir
    - hl7
    - ems
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: blue
    entityIcon:
      icon: SwapHoriz
      iconTooltip: Patient Data Exchange
    statusIcons:
      - icon: VerifiedUser
        iconColor: forestgreen
        iconTooltip: HIPAA Ready
spec:
  owner: group:healthcare-integration-platform-team
  domain: healthcare
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: healthcare-integration-platform-team
  description: Owns the TIBCO EMS broker, destinations, FHIR gateway and shared integration platform
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: blue
    entityIcon:
      icon: Groups
      iconTooltip: Integration Platform Team
spec:
  type: team
  profile:
    displayName: Integration Platform Team
    email: integration-platform@healthcare.example.com
  children: []
---
