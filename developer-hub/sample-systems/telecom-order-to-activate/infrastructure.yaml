# Infrastructure — OSS/BSS backend systems and the TIBCO EMS broker + TMF API gateway.
# These are modelled as Resources; integration apps reach them via `dependsOn`.
#
# Each EMS destination also declares `dependencyOf: [api:<message>]` — i.e. "the message
# contract depends on this destination". This gives a clickable link from the queue/topic to
# its message API (and an edge in the system topology). Note: the API's own overview page will
# not list the destination back — TIBCO Developer Hub API entities only ever surface apiProvidedBy /
# apiConsumedBy / ownedBy / partOf — so the message links back via its producer/consumer apps.
#
# ── OSS/BSS backends (navy = external systems) ───────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: crm-bss
  title: CRM / BSS
  description: Customer relationship and BSS system where commercial product orders originate
  tags:
    - bss
    - crm
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: navy
    entityIcon:
      icon: People
      iconTooltip: CRM / BSS
    statusIcons:
      - icon: Public
        iconColor: steelblue
        iconTooltip: External System
spec:
  type: bss-system
  lifecycle: production
  owner: group:telecom-order-management-team
  system: order-to-activate-hub
