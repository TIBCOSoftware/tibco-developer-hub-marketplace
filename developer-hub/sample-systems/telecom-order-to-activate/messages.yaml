                  "name": { "type": "string" },
                  "serviceType": { "type": "string", "examples": ["fiber-access", "mobile-data", "vpn"] },
                  "serviceCharacteristic": { "type": "array", "items": { "type": "object" } },
                  "place": { "type": "array", "items": { "type": "object" } }
                }
              }
            }
          }
        }
      }
