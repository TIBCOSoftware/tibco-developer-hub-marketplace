spec:
  type: tmf-message
  lifecycle: production
  owner: group:network-activation-team
  system: order-to-activate-hub
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:telco:activation:request",
      "title": "ActivationRequest",
      "description": "Activation request produced from TMF652 resource orders and queued on q.activation.request.",
