      "required": ["orderId", "resourceId", "activationType", "parameters"],
      "properties": {
        "orderId": { "type": "string" },
        "resourceId": { "type": "string" },
        "serviceOrderRef": { "type": "string" },
        "productOrderRef": { "type": "string" },
        "activationType": { "type": "string", "enum": ["fiber", "mobile", "vpn", "voice"] },
        "parameters": {
          "type": "object",
          "additionalProperties": { "type": ["string", "number", "boolean"] },
          "examples": [{ "vlan": "3102", "profile": "1G-FIBER" }]
        }
      }
    }
