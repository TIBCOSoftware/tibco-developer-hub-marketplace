# Message contracts — each TMF / activation message is modelled as a kind: API
# whose definition holds the JSON Schema INLINE.
#
# type: tmf-message (a neutral custom type) — NOT 'asyncapi'/'openapi'. The api-docs
# Definition tab picks a strict renderer by spec.type: 'asyncapi' would validate the
# text as an AsyncAPI document and error ("not an AsyncAPI document") because our
# payload is a JSON Schema, not an AsyncAPI spec. An unrecognized type falls
# back to a plain raw view, which displays the schema as-is. Topology and impact
# analysis don't depend on the type.
#
# NOTE: definitions are inlined (definition: |) rather than referenced via
# `$text: ./schemas/..` because this local backend has no UrlReader for `file:`
# URLs, so local-file $text placeholders silently drop the entity. ($text works
# only when the catalog file is read from a Git URL.) Inlining is reliable for a
# local sample — to demo impact analysis, edit the schema in the block below and
# re-run the impact-analysis skill on the message.
#
# Modelling messages as APIs is what makes impact analysis work: every component
# that consumesApis a message becomes an `apiConsumedBy` = direct-impact consumer.
# (Provider/consumer relations are declared on the components in integration-apps.yaml.)
#
# ── TMF / activation JSON Schema contracts (yellow) ──────────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tmf622-product-order-msg
  description: TMF622 Product Ordering message (JSON Schema) on q.product-order.inbound
  tags:
    - tmf
    - message
    - json-schema
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: yellow
    entityIcon:
      icon: Description
      iconTooltip: TMF Message Contract (JSON Schema)
    statusIcons:
      - icon: Code
        iconColor: darkorange
        iconTooltip: JSON Schema
spec:
  type: tmf-message
  lifecycle: production
  owner: group:telecom-order-management-team
  system: order-to-activate-hub
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:telco:tmf:product-order",
      "title": "TMF622 ProductOrder",
      "description": "Product order accepted at the TMF API gateway and queued on q.product-order.inbound.",
      "type": "object",
      "additionalProperties": false,
      "required": ["id", "state", "productOrderItem", "relatedParty"],
      "properties": {
        "id": { "type": "string" },
        "href": { "type": "string", "format": "uri" },
        "externalId": { "type": "string" },
        "state": { "type": "string", "enum": ["acknowledged", "inProgress", "completed", "failed", "cancelled"] },
        "priority": { "type": "string", "enum": ["low", "normal", "high", "urgent"], "default": "normal" },
        "requestedStartDate": { "type": "string", "format": "date-time" },
        "productOrderItem": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["id", "action", "product"],
            "properties": {
              "id": { "type": "string" },
              "action": { "type": "string", "enum": ["add", "modify", "delete", "noChange"] },
              "state": { "type": "string" },
              "productOffering": {
                "type": "object",
                "required": ["id", "name"],
                "properties": {
                  "id": { "type": "string" },
                  "name": { "type": "string" }
                }
              },
              "product": {
                "type": "object",
                "required": ["id", "name"],
                "properties": {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "place": { "type": "array", "items": { "type": "object" } },
                  "productCharacteristic": { "type": "array", "items": { "type": "object" } }
                }
              }
            }
          }
        },
        "relatedParty": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["id", "role"],
            "properties": {
              "id": { "type": "string" },
              "name": { "type": "string" },
              "role": { "type": "string", "examples": ["customer", "accountOwner"] },
              "@referredType": { "type": "string" }
            }
          }
        }
      }
    }
---
