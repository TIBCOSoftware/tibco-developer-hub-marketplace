# Integration apps — TIBCO BW6 / Flogo applications.
# All graph edges are declared here (the TIBCO Developer Hub's built-in processor generates
# provides/consumes/dependsOn relations from the Component side):
#   providesApis / consumesApis -> message contract edges (drive impact analysis)
#   dependsOn                    -> OSS/BSS backend + EMS destination infrastructure edges
#
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-capture-bw6
  description: BW6 app — receives TMF622 product orders, validates CRM/catalog context and publishes TMF641 service orders
  tags:
    - bw6
    - integration
    - tmf622
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: Receipt
      iconTooltip: Order Capture (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:telecom-order-management-team
  system: order-to-activate-hub
  consumesApis:
    - tmf622-product-order-msg
  providesApis:
    - tmf641-service-order-msg
  dependsOn:
    - resource:crm-bss
    - resource:product-catalog-system
    - resource:tmf-api-gateway
    - resource:telecom-ems-server
    - resource:ems-q-product-order-inbound
    - resource:ems-t-service-order-created
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: service-orchestrator-bw6
  description: BW6 app — decomposes TMF641 service orders into TMF652 resource orders using OSS inventory
  tags:
    - bw6
    - integration
    - tmf641
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: AccountTree
      iconTooltip: Service Orchestrator (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:service-orchestration-team
  system: order-to-activate-hub
  consumesApis:
    - tmf641-service-order-msg
  providesApis:
    - tmf652-resource-order-msg
  dependsOn:
    - resource:oss-inventory
    - resource:telecom-ems-server
    - resource:ems-t-service-order-created
    - resource:ems-t-resource-order-created
---
