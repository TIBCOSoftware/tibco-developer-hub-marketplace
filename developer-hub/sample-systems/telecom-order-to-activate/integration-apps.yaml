  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: green
    entityIcon:
      icon: Router
      iconTooltip: Resource Provisioner (Flogo)
spec:
  type: service
  lifecycle: production
  owner: group:resource-provisioning-team
  system: order-to-activate-hub
  consumesApis:
    - tmf652-resource-order-msg
  providesApis:
