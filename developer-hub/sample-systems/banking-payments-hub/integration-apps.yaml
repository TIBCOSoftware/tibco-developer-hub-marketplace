# Integration apps — TIBCO BW6 / Flogo applications.
# All graph edges are declared here (the TIBCO Developer Hub's built-in processor generates
# provides/consumes/dependsOn relations from the Component side):
#   providesApis / consumesApis -> message contract edges (drive impact analysis)
#   dependsOn                    -> banking backend + EMS destination infrastructure edges
#
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payment-gateway-bw6
  description: BW6 app — receives customer payment initiations through the API gateway and publishes FI-to-FI credit transfers
  tags:
    - bw6
    - integration
    - payments
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: Payments
      iconTooltip: Payment Gateway (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:payments-engineering-team
  system: payments-integration-hub
  consumesApis:
    - pain001-payment-initiation-msg
  providesApis:
    - pacs008-credit-transfer-msg
  dependsOn:
    - resource:core-banking-system
    - resource:payments-api-gateway
    - resource:banking-ems-server
    - resource:ems-q-payment-initiation.inbound
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fraud-scoring-flogo
  description: Flogo app — scores credit transfers against fraud and sanctions services and publishes fraud decisions
  tags:
    - flogo
    - integration
    - fraud
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: green
    entityIcon:
      icon: Security
      iconTooltip: Fraud Scoring (Flogo)
spec:
  type: service
  lifecycle: production
  owner: group:fraud-risk-team
  system: payments-integration-hub
  consumesApis:
    - pacs008-credit-transfer-msg
  providesApis:
    - fraud-score-msg
  dependsOn:
    - resource:fraud-detection-engine
    - resource:sanctions-screening
    - resource:banking-ems-server
    - resource:ems-t-fraud-alert
