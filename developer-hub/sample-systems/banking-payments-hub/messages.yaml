    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: yellow
    entityIcon:
      icon: Description
      iconTooltip: Message Contract (JSON Schema)
    statusIcons:
      - icon: Code
        iconColor: darkorange
        iconTooltip: JSON Schema
spec:
  type: iso20022-message
  lifecycle: production
  owner: group:ledger-team
  system: payments-integration-hub
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:banking:ems:ledger-posting",
      "title": "LedgerPosting",
      "description": "Debit and credit ledger posting request on q.ledger.posting (clearing-orchestrator-bw6 -> ledger-poster-bw6).",
      "type": "object",
      "additionalProperties": false,
      "required": ["postingId", "paymentId", "postingDate", "currency", "entries"],
      "properties": {
        "postingId": { "type": "string" },
        "paymentId": { "type": "string" },
        "postingDate": { "type": "string", "format": "date" },
        "currency": { "type": "string", "minLength": 3, "maxLength": 3 },
        "entries": {
          "type": "array",
          "minItems": 2,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["account", "direction", "amount"],
            "properties": {
              "account": { "type": "string" },
              "direction": { "type": "string", "enum": ["DEBIT", "CREDIT"] },
              "amount": { "type": "number", "exclusiveMinimum": 0 },
              "costCenter": { "type": "string" },
              "narrative": { "type": "string" }
            }
          }
        }
      }
    }
---
