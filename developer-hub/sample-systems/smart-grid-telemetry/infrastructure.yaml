# Infrastructure — field devices, utility backends and the MQTT / TIBCO EMS streaming fabric.
# These are modelled as Resources; integration apps reach them via `dependsOn`.
#
# Each messaging destination declares `dependencyOf: [api:<message>]` — i.e. "the message
# contract depends on this destination". This gives a clickable link from the queue/topic to
# its message API (and an edge in the system topology). Message links back are surfaced through
# producer/consumer apps in integration-apps.yaml.
#
# ── Field devices and utility backends (navy = external systems) ─────────────
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: smart-meter-fleet
  title: Smart Meter Fleet
  description: Field smart meters publishing interval consumption and power quality telemetry
  tags:
    - smart-grid
    - device-fleet
    - iot
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: navy
    entityIcon:
      icon: Bolt
      iconTooltip: Smart Meter Fleet
    statusIcons:
      - icon: Public
        iconColor: steelblue
        iconTooltip: Field Devices
spec:
  type: device-fleet
  lifecycle: production
  owner: group:edge-integration-team
  system: smart-grid-telemetry-system
