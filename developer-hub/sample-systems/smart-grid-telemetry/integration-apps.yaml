# Integration apps — TIBCO Flogo Edge / Flogo / BW6 applications.
# All graph edges are declared here (the TIBCO Developer Hub's built-in processor generates
# provides/consumes/dependsOn relations from the Component side):
#   providesApis / consumesApis -> message contract edges (drive impact analysis)
#   dependsOn                    -> field devices, utility backends + messaging infrastructure edges
#
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: meter-ingest-flogo
  description: Flogo EDGE app — receives smart meter telemetry over MQTT and publishes normalized meter readings
  tags:
    - flogo
    - edge
    - iot
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: green
    entityIcon:
      icon: Sensors
      iconTooltip: Meter Ingest (Flogo EDGE)
    statusIcons:
      - icon: CloudDone
        iconColor: forestgreen
        iconTooltip: Edge Deployed
spec:
  type: service
  lifecycle: production
  owner: group:edge-integration-team
  system: smart-grid-telemetry-system
  providesApis:
    - meter-reading-msg
  dependsOn:
    - resource:smart-meter-fleet
    - resource:mqtt-broker
    - resource:grid-ems-server
    - resource:ems-q-meter-reading-inbound
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: telemetry-normalizer-bw6
  description: BW6 app — validates meter readings, enriches with SCADA state and publishes grid events
  tags:
    - bw6
    - integration
    - telemetry
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: DeviceHub
      iconTooltip: Telemetry Normalizer (BW6)
spec:
  type: service
  lifecycle: production
  owner: group:telemetry-team
  system: smart-grid-telemetry-system
  consumesApis:
    - meter-reading-msg
  providesApis:
    - grid-event-msg
  dependsOn:
    - resource:scada-system
    - resource:time-series-historian
    - resource:grid-ems-server
    - resource:ems-q-meter-reading-inbound
    - resource:ems-t-grid-event
