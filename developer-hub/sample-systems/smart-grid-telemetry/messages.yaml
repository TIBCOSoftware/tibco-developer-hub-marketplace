# Message contracts — each IoT / EMS topic or queue message is modelled as a kind: API
# whose definition holds the JSON Schema INLINE.
#
# type: iot-message (a neutral custom type) — NOT 'asyncapi'/'openapi'. The api-docs
# Definition tab picks a strict renderer by spec.type: 'asyncapi' would validate the
# text as an AsyncAPI document and error because our payload is a JSON Schema, not an
# AsyncAPI spec. An unrecognized type falls back to a plain raw view, which displays
# the schema as-is. Topology and impact analysis don't depend on the type.
#
# NOTE: definitions are inlined (definition: |) rather than referenced via
# `$text: ./schemas/..` because this local backend has no UrlReader for `file:`
# URLs, so local-file $text placeholders silently drop the entity. Inlining is reliable
# for a local sample — to demo impact analysis, edit the schema in the block below and
# re-run the impact-analysis skill on the message.
#
# Modelling messages as APIs is what makes impact analysis work: every component
# that consumesApis a message becomes an `apiConsumedBy` = direct-impact consumer.
# Provider/consumer relations are declared on the components in integration-apps.yaml.
#
# ── JSON Schema contracts (smart grid telemetry, yellow) ─────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: meter-reading-msg
  description: Smart meter reading message (JSON Schema) on q.meter-reading.inbound
  tags:
    - iot
    - message
    - json-schema
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: yellow
    entityIcon:
      icon: Description
      iconTooltip: Message Contract (JSON Schema)
    statusIcons:
      - icon: Code
        iconColor: darkorange
        iconTooltip: JSON Schema
spec:
  type: iot-message
  lifecycle: production
  owner: group:telemetry-team
  system: smart-grid-telemetry-system
  definition: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "urn:utility:iot:meter-reading",
      "title": "MeterReading",
      "description": "Normalized smart meter reading from edge ingest on q.meter-reading.inbound. Consumed by telemetry, analytics and billing apps.",
      "type": "object",
      "additionalProperties": false,
      "required": ["meterId", "timestamp", "kWh", "voltage", "quality"],
      "properties": {
        "meterId": { "type": "string", "minLength": 1 },
        "timestamp": { "type": "string", "format": "date-time" },
        "kWh": { "type": "number", "minimum": 0 },
        "voltage": { "type": "number", "minimum": 0 },
        "quality": { "type": "string", "enum": ["GOOD", "ESTIMATED", "MISSING", "SUSPECT"] }
      }
    }
---
