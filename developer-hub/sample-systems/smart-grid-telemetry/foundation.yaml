# Foundation — Domain, System and the owning teams for the smart grid
# edge-to-cloud IoT telemetry pipeline.
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: energy-utilities
  description: Energy & utilities domain — smart grid telemetry, outage and usage integrations
  tags:
    - energy
    - utilities
    - iot
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: purple
    entityIcon:
      icon: Bolt
      iconTooltip: Energy & Utilities Domain
spec:
  owner: group:grid-platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: smart-grid-telemetry-system
  description: Edge-to-cloud telemetry pipeline connecting smart meters, SCADA, EMS messaging and analytics applications
  tags:
    - energy
    - utilities
    - telemetry
    - iot
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: blue
    entityIcon:
      icon: Hub
      iconTooltip: Smart Grid Telemetry System
    statusIcons:
      - icon: VerifiedUser
        iconColor: forestgreen
        iconTooltip: Production Ready
spec:
  owner: group:grid-platform-team
  domain: energy-utilities
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: grid-platform-team
  description: Owns the shared grid integration platform, brokers and destinations
  annotations:
    backstage.io/techdocs-ref: dir:.
  tibco.developer.hub/topology:
    theme:
      name: blue
    entityIcon:
      icon: Groups
      iconTooltip: Grid Platform Team
spec:
  type: team
  profile:
    displayName: Grid Platform Team
    email: grid-platform@utility.example.com
  children: []
---
